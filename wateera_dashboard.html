    if(!name) return;
    const team = document.getElementById('c_team').value;
    const referredTo = document.getElementById('c_ref').value;
    const transactionNo = document.getElementById('c_txn').value.trim();

    if(isEdit){
      const c = state.corr.find(x=>x.id===existing.id);
      if(c){
        c.transactionNo = transactionNo; c.team = team; c.name = name;
        c.scope = document.getElementById('c_scope').value;
        c.dir = document.getElementById('c_dir').value;
        c.referredTo = referredTo;
        c.date = document.getElementById('c_date').value;
        c.status = document.getElementById('c_status').value;
      }
      closeModal(); render(); saveDataToDrive();
      return;
    }

    const cid = nextId('c');
    const key = document.getElementById('c_key').value.trim() || `K-${idCounter}`;
    const createTask = document.getElementById('c_createTask').checked;
    state.corr.push({
      id: cid, key, transactionNo, team, scope: document.getElementById('c_scope').value, dir: document.getElementById('c_dir').value,
      dept:"الإدارة التنفيذية", referredTo, date: document.getElementById('c_date').value, status:"progress", name,
      linkedTaskId: createTask ? "PENDING" : null,
    });
    if(createTask){
      const tid = nextId('r');
      state.tasks.push({
        id: tid, key, team, task:`متابعة معاملة: ${name}`, type:"تراسل", R: referredTo, A:"—", C:"—", I:"—",
        status:"progress", dueDate:"", notes:`منشأة تلقائيًا من معاملة ${key}`, linkedCorrId: cid, linkedFacilityId:null,
      });
      const c = state.corr.find(x=>x.id===cid); c.linkedTaskId = tid;
    }
    closeModal(); render(); saveDataToDrive();
  });
}

function openFacilityForm(presetKind, existing){
  const isEdit = !!existing;
  const kind = existing ? existing.kind : (presetKind || "مختبر");
  const body = `
    <div class="fgrid">
      ${inputRow("رقم المرجع (اختياري)", `<input type="text" id="fac_key" placeholder="يُولَّد تلقائيًا" value="${esc(existing?.key||'')}" ${isEdit?'disabled':''}>`)}
      ${inputRow("النوع", `<select id="fac_kind"><option ${kind==='مختبر'?'selected':''}>مختبر</option><option ${kind==='محطة تجريبية'?'selected':''}>محطة تجريبية</option></select>`)}
      ${inputRow("الاسم", `<input type="text" id="fac_name" value="${esc(existing?.name||'')}">`, true)}
      ${inputRow("الفريق المسؤول", `<select id="fac_team">${teamOptions(existing?.team || state.teams[0].id)}</select>`)}
      ${inputRow("الحالة", `<select id="fac_status">${statusOptions(LAB_STATUS, existing?.status || 'active')}</select>`)}
      ${inputRow("الموقع", `<input type="text" id="fac_loc" value="${esc(existing?.location||'')}">`)}
      ${inputRow("السعة / الطاقة الاستيعابية", `<input type="text" id="fac_cap" value="${esc(existing?.capacity||'')}">`)}
      ${inputRow("ملاحظات", `<input type="text" id="fac_notes" value="${esc(existing?.notes||'')}">`, true)}
    </div>
    ${isEdit ? '' : `<label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;cursor:pointer;">
      <input type="checkbox" id="fac_createTask"> إنشاء مهمة RACI مرتبطة تلقائيًا (صيانة / متابعة تشغيل)
    </label>`}`;
  openModal(isEdit ? "تعديل " + (kind === "مختبر" ? "مختبر" : "محطة تجريبية") : (kind === "مختبر" ? "إضافة مختبر" : "إضافة محطة تجريبية"), body, ()=>{
    const name = document.getElementById('fac_name').value.trim();
    if(!name) return;
    const status = document.getElementById('fac_status').value;
    const team = document.getElementById('fac_team').value;

    if(isEdit){
      const f = state.facilities.find(x=>x.id===existing.id);
      if(f){
        f.kind = document.getElementById('fac_kind').value;
        f.name = name; f.team = team; f.status = status;
        f.location = document.getElementById('fac_loc').value;
        f.capacity = document.getElementById('fac_cap').value;
        f.notes = document.getElementById('fac_notes').value;
      }
      closeModal(); render(); saveDataToDrive();
      return;
    }

    const fid = nextId('f');
    const key = document.getElementById('fac_key').value.trim() || `F-${idCounter}`;
    const createTask = document.getElementById('fac_createTask').checked;
    state.facilities.push({
      id: fid, key, kind: document.getElementById('fac_kind').value, name, team, status,
      location: document.getElementById('fac_loc').value, capacity: document.getElementById('fac_cap').value,
      notes: document.getElementById('fac_notes').value,
    });
    if(createTask){
      state.tasks.push({
        id: nextId('r'), key, team, task: status==='maintenance' ? `صيانة: ${name}` : `متابعة تشغيل: ${name}`,
        type:"صيانة", R:"—", A:"—", C:"—", I:"—", status: status==='maintenance' ? "progress" : "paused",
        dueDate:"", notes:`منشأة تلقائيًا من مرفق ${key}`, linkedCorrId:null, linkedFacilityId: fid,
      });
    }
    closeModal(); render(); saveDataToDrive();
  });
}

/* ---------------- events ---------------- */
function bindEvents(){
  root.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.tab = btn.getAttribute('data-tab'); state.search=""; render(); });
  });
  root.querySelectorAll('[data-team]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.activeTeam = btn.getAttribute('data-team'); render(); });
  });
  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{ state.search = e.target.value; render(); searchInput.focus(); });
  }
  const addTaskBtn = document.getElementById('addTaskBtn'); if(addTaskBtn) addTaskBtn.addEventListener('click', ()=>openTaskForm());
  const addCorrBtn = document.getElementById('addCorrBtn'); if(addCorrBtn) addCorrBtn.addEventListener('click', ()=>openCorrForm());
  const addLabBtn = document.getElementById('addFacilityBtn_labs'); if(addLabBtn) addLabBtn.addEventListener('click', ()=>openFacilityForm("مختبر"));
  const addStationBtn = document.getElementById('addFacilityBtn_stations'); if(addStationBtn) addStationBtn.addEventListener('click', ()=>openFacilityForm("محطة تجريبية"));
  root.querySelectorAll('.editTaskBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = state.tasks.find(x=>x.id===btn.getAttribute('data-id'));
      if(t) openTaskForm(t);
    });
  });
  root.querySelectorAll('.editCorrBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const c = state.corr.find(x=>x.id===btn.getAttribute('data-id'));
      if(c) openCorrForm(c);
    });
  });
  root.querySelectorAll('.editFacilityBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const f = state.facilities.find(x=>x.id===btn.getAttribute('data-id'));
      if(f) openFacilityForm(f.kind, f);
    });
  });
  const addDocumentBtn = document.getElementById('addDocumentBtn');
  if(addDocumentBtn) addDocumentBtn.addEventListener('click', ()=>openDocumentForm());
  root.querySelectorAll('.editDocumentBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const d = state.documents.find(x=>x.id===btn.getAttribute('data-id'));
      if(d) openDocumentForm(d);
    });
  });
  const importDocsBtn = document.getElementById('importDocsBtn');
  const importDocsFile = document.getElementById('importDocsFile');
  if(importDocsBtn && importDocsFile){
    importDocsBtn.addEventListener('click', ()=> importDocsFile.click());
    importDocsFile.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(file) handleDocsImportFile(file);
      importDocsFile.value = '';
    });
  }
  const downloadTemplateBtn = document.getElementById('downloadTemplateBtn');
  if(downloadTemplateBtn) downloadTemplateBtn.addEventListener('click', downloadDocumentsTemplate);
  const resignedFilterCard = document.getElementById('resignedFilterCard');
  if(resignedFilterCard) resignedFilterCard.addEventListener('click', ()=>{ state.docsFilter = 'resigned'; render(); });
  const clearDocsFilter = document.getElementById('clearDocsFilter');
  if(clearDocsFilter) clearDocsFilter.addEventListener('click', ()=>{ state.docsFilter = 'all'; render(); });
  root.querySelectorAll('.downloadDocumentBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const d = state.documents.find(x=>x.id===btn.getAttribute('data-id'));
      if(d) downloadExpertFile(d);
    });
  });

  const reportBtn = document.getElementById('reportBtn');
  if(reportBtn) reportBtn.addEventListener('click', printReport);
  const signOutBtn = document.getElementById('signOutBtn');
  if(signOutBtn) signOutBtn.addEventListener('click', signOut);
  const restoreBtn = document.getElementById('restoreBtn');
  if(restoreBtn) restoreBtn.addEventListener('click', openRestoreModal);

  const hrChatInput = document.getElementById('hrChatInput');
  const hrChatSendBtn = document.getElementById('hrChatSendBtn');
  if(hrChatInput && hrChatSendBtn){
    const doSend = ()=>{
      const val = hrChatInput.value;
      hrChatInput.value = '';
      hrSendMsg(val);
    };
    hrChatSendBtn.addEventListener('click', doSend);
    hrChatInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') doSend(); });
    hrChatInput.focus();
  }
  root.querySelectorAll('.hrSuggestBtn').forEach(btn=>{
    btn.addEventListener('click', ()=> hrSendMsg(btn.getAttribute('data-q')));
  });
  const hrBox = document.getElementById('hrChatBox');
  if(hrBox) hrBox.scrollTop = hrBox.scrollHeight;

  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    const payload = { teams: state.teams, tasks: state.tasks, corr: state.corr, facilities: state.facilities, documents: state.documents, idCounter, exportedAt: new Date().toISOString() };
    const text = JSON.stringify(payload, null, 2);
    const stamp = new Date().toISOString().slice(0,10);

    let autoDownloadWorked = false;
    try{
      const blob = new Blob([text], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `wateera-backup-${stamp}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      autoDownloadWorked = true;
    } catch(e){ autoDownloadWorked = false; }

    showBackupModal(text, stamp, autoDownloadWorked);
  });

  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');
  if(importBtn && importFile){
    importBtn.addEventListener('click', ()=> importFile.click());
    importFile.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          const data = JSON.parse(ev.target.result);
          if(!data.teams || !data.tasks || !data.corr || !data.facilities) throw new Error("ملف غير صالح");
          state.teams = data.teams; state.tasks = data.tasks; state.corr = data.corr; state.facilities = data.facilities;
          state.documents = data.documents || [];
          idCounter = data.idCounter || idCounter;
          render(); saveDataToDrive();
        } catch(err){
          alert("تعذّرت قراءة ملف النسخة الاحتياطية — تأكد أنه ملف JSON صادر من هذه اللوحة.");
        }
        importFile.value = "";
      };
      reader.readAsText(file);
    });
  }
}

render();
waitForGIS(()=>{
  initGoogleAuth();
  state.gisReady = true;
  render();
});
})();
</script>
