/* ---------------- helpers ---------------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysFrom(dateStr){ return Math.floor((new Date() - new Date(dateStr)) / 86400000); }
function isOverdue(item){ return item.status !== "done" && item.dueDate && daysFrom(item.dueDate) > 3; }
function flightClassForGrade(grade){
  const map = { GA:"درجة رجال الأعمال", GB:"درجة رجال الأعمال", GC:"الدرجة السياحية", GD:"الدرجة السياحية", GE:"الدرجة السياحية", GF:"الدرجة السياحية" };
  return map[grade] || "";
}

function docDateStatus(dateStr){
  if(!dateStr) return 'none';
  const d = daysFrom(dateStr); // موجب = أيام مضت منذ الانتهاء (منتهية)، سالب = أيام متبقية حتى الانتهاء
  if(d > 0) return 'expired';
  if(-d <= 30) return 'soon';
  return 'ok';
}
function worstDocStatus(...statuses){
  const order = { expired:3, soon:2, ok:1, none:0 };
  return statuses.reduce((worst, s) => order[s] > order[worst] ? s : worst, 'none');
}
function teamName(id){ const t = state.teams.find(t=>t.id===id); return t ? t.name : "—"; }
function teamColor(id){ const i = state.teams.findIndex(t=>t.id===id); return TEAM_COLORS[i % TEAM_COLORS.length]; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function linkedCorrFor(task){ return state.corr.find(c=>c.id===task.linkedCorrId); }
function linkedTaskFor(c){ return state.tasks.find(t=>t.id===c.linkedTaskId); }
function facilityFor(task){ return state.facilities.find(f=>f.id===task.linkedFacilityId); }
function tasksForFacility(fid){ return state.tasks.filter(t=>t.linkedFacilityId===fid); }

function waitForGIS(cb){
  if(window.google && window.google.accounts && window.google.accounts.oauth2){ cb(); }
  else setTimeout(()=>waitForGIS(cb), 100);
}

function initGoogleAuth(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async (resp) => {
      if(resp.error){
        state.saveStatus = "تعذّر تسجيل الدخول: " + resp.error;
        render();
        return;
      }
      driveAccessToken = resp.access_token;
      state.unlocked = true;
      state.saveStatus = "جارٍ تحميل البيانات من Google Drive...";
      render();
      await loadDataFromDrive();
    },
  });
}

function signIn(){
  if(!tokenClient) return;
  tokenClient.requestAccessToken();
}

function signOut(){
  if(driveAccessToken && window.google){
    google.accounts.oauth2.revoke(driveAccessToken, ()=>{});
  }
  driveAccessToken = null;
  driveFileId = null;
  state.unlocked = false;
  state.ready = false;
  render();
}

async function driveFindFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
    headers: { Authorization: `Bearer ${driveAccessToken}` }
  });
  if(!res.ok) throw new Error("drive_list_failed");
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function driveGetFileContent(fileId){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { Authorization: `Bearer ${driveAccessToken}` }
  });
  if(!res.ok) throw new Error("drive_get_failed");
  return await res.text();
}

async function driveCreateFile(content, fileName){
  const metadata = { name: fileName || DRIVE_FILE_NAME, mimeType: "application/json" };
  const boundary = "-------wateeraBoundary";
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
    method: "POST",
    headers: { Authorization: `Bearer ${driveAccessToken}`, "Content-Type": `multipart/related; boundary=${boundary}` },
    body,
  });
  if(!res.ok) throw new Error("drive_create_failed");
  const data = await res.json();
  return data.id;
}

async function driveDeleteFile(fileId){
  await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
    method: "DELETE",
    headers: { Authorization: `Bearer ${driveAccessToken}` },
  });
}

async function driveListAutoBackups(){
  const q = encodeURIComponent(`name contains 'wateera-autobackup-' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,createdTime)&orderBy=createdTime desc`, {
    headers: { Authorization: `Bearer ${driveAccessToken}` }
  });
  if(!res.ok) return [];
  const data = await res.json();
  return data.files || [];
}

const AUTO_BACKUP_KEEP = 15;

/* يحفظ نسخة احتياطية تلقائية بتاريخ ووقت داخل نفس Google Drive عند كل حفظ — شبكة أمان ضد أي خطأ برمجي مستقبلي، بدون أي تدخل يدوي */
async function saveAutoBackupToDrive(content){
  try{
    const stamp = new Date().toISOString().replace(/[:.]/g, "-");
    await driveCreateFile(content, `wateera-autobackup-${stamp}.json`);
    const backups = await driveListAutoBackups();
    if(backups.length > AUTO_BACKUP_KEEP){
      const toDelete = backups.slice(AUTO_BACKUP_KEEP);
      for(const f of toDelete){ await driveDeleteFile(f.id); }
    }
  } catch(e){
    // فشل النسخ الاحتياطي التلقائي لا يوقف الحفظ الأساسي
  }
}

async function driveUpdateFile(fileId, content){
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: "PATCH",
    headers: { Authorization: `Bearer ${driveAccessToken}`, "Content-Type": "application/json" },
    body: content,
  });
  if(!res.ok) throw new Error("drive_update_failed");
}

async function driveUploadFile(file, customName){
  const metadata = { name: customName || file.name, mimeType: file.type || "application/octet-stream" };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", file);
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink", {
    method: "POST",
    headers: { Authorization: `Bearer ${driveAccessToken}` },
    body: form,
  });
  if(!res.ok) throw new Error("drive_upload_failed");
  const data = await res.json();
  return { id: data.id, url: data.webViewLink };
}

  let changed = false;

  const ihm = state.documents.find(x=>x.employeeId==="u800502");
  if(ihm && (ihm.passportNo !== "M63143424" || ihm.passportExpiry !== "2026-08-19")){
    ihm.passportNo = "M63143424";
    ihm.passportExpiry = "2026-08-19";

    changed = true;
  }

  const east = state.documents.find(x=>x.employeeId==="u800506");
  if(east && east.resignationDate !== "2023-07-25"){
    east.resignationDate = "2023-07-25";
    east.notes = "اعتُمد تاريخ الاستقالة من نموذج إخلاء الطرف الموقّع رسميًا (2023-07-25) بدلاً من كشف الموارد البشرية";

  }

/* تطبيق درجات الخبراء (GA-GF) بناءً على مطابقة الراتب الأساسي بجدول الدرجات — يعمل مرة واحدة بفضل علامة gradesApplied */
function applyGrades(){
  const grades = {
    u800501: "GA", // بيونغ سونغ بارك — 78,125
    u800502: "GA", // سيونغ وون ايم — 78,125
    u800527: "GB", // زيد لاتاري — 76,000
    u800513: "GE", // شنغ لي — 29,815
    u800512: "GC", // غلام مصطفى — 51,500
    u800510: "GB", // يونغ ووك يو — 72,890
    u800524: "GC", // تشن يو لي — 47,037
    u800521: "GB", // حسين باصي — 67,200
    u800516: "GA", // نيل مارتن رينولدز — 110,000 (بدل سكنه 27,500 أعلى من المعتاد لهذي الدرجة، تحقق)
    u800528: "GC", // أوغ بريدوم — 44,445
    u800514: "GC", // أسرار — 43,889
    u800520: "GF", // عبدالرحمن مجدي — 17,845
  };
  let changed = false;
  Object.entries(grades).forEach(([employeeId, grade])=>{
    const d = state.documents.find(x=>x.employeeId===employeeId);

    }

}

async function saveDataToDrive(){

    if(!driveFileId){
      driveFileId = await driveCreateFile(payload);
    } else {
      await driveUpdateFile(driveFileId, payload);
    }
    saveAutoBackupToDrive(payload); // شبكة أمان تلقائية، لا تعطّل الحفظ الأساسي لو فشلت
    const t = new Date().toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' });
    state.saveStatus = "آخر حفظ في Google Drive: " + t;

    updateSaveIndicator(state.saveStatus, "#F2A6A0");
  }
}

function computeStats(pool){
  return {
    total: pool.length,
    done: pool.filter(t=>t.status==='done').length,
    progress: pool.filter(t=>t.status==='progress').length,
    paused: pool.filter(t=>t.status==='paused').length,
    overdue: pool.filter(isOverdue).length,
  };
}

};
const DOC_DATE_FIELDS = new Set(["birthDate","joiningDate","resignationDate","iqamaExpiry","passportExpiry","workCardExpiry"]);

function normalizeImportDate(val){
  if(val === null || val === undefined || val === '') return '';
  if(val instanceof Date){
    const y = val.getFullYear(), m = String(val.getMonth()+1).padStart(2,'0'), d = String(val.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  const s = String(val).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const parsed = new Date(s);
  if(!isNaN(parsed.getTime())){
    const y = parsed.getFullYear(), m = String(parsed.getMonth()+1).padStart(2,'0'), d = String(parsed.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  return s;
}

function handleDocsImportFile(file){
  const msg = document.getElementById('importDocsMsg');
  if(msg) msg.textContent = "جارٍ قراءة الملف...";
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      let added = 0, updated = 0, skipped = 0;
      rows.forEach(row=>{
        const rec = {};
        Object.entries(DOC_FIELD_MAP).forEach(([ar, key])=>{
          let v = row[ar];
          v = DOC_DATE_FIELDS.has(key) ? normalizeImportDate(v) : ((v===null||v===undefined) ? '' : String(v).trim());
          rec[key] = v;
        });
        if(!rec.name){ skipped++; return; }
        let existing = null;
        if(rec.employeeId) existing = state.documents.find(d=>d.employeeId===rec.employeeId);
        if(!existing) existing = state.documents.find(d=>d.name===rec.name);
        if(existing){
          Object.assign(existing, rec);
          updated++;
        } else {
          state.documents.push({ id: nextId('d'), team: state.teams[0].id, workCardExpiry:'', ...rec });
          added++;
        }
      });
      if(msg) msg.textContent = `تم الاستيراد: ${added} سجل جديد، ${updated} سجل محدَّث${skipped?`، ${skipped} صف متجاهل (بدون اسم)`:''}`;
      render();
      saveDataToDrive();
    } catch(err){
      if(msg) msg.textContent = "تعذّرت قراءة الملف — تأكد أنه ملف إكسل صالح بنفس تنسيق النموذج";
    }
  };
  reader.readAsArrayBuffer(file);
}

function downloadDocumentsTemplate(){
  const headers = Object.keys(DOC_FIELD_MAP);
  const rows = state.documents.map(d => headers.map(h => d[DOC_FIELD_MAP[h]] || ''));
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws['!cols'] = headers.map(()=>({ wch: 20 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "بيانات الخبراء");
  XLSX.writeFile(wb, "نموذج_استيراد_الخبراء.xlsx");
}

async function extractTextFromFile(file){
  const ext = file.name.split('.').pop().toLowerCase();
  if(ext === 'txt'){
    return await file.text();
  }
  if(ext === 'pdf'){
    if(window.pdfjsLib){
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = '';
    for(let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it => it.str).join(' ') + '\n\n';
    }
    return text;
  }
  if(ext === 'docx'){
    const buf = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    return result.value;
  }
  throw new Error('unsupported_file_type');
}

async function handleKnowledgeUpload(file){
  const msg = document.getElementById('copilotUploadMsg');
  if(msg) msg.textContent = `جارٍ قراءة "${file.name}"...`;
  try{
    const text = await extractTextFromFile(file);
    if(!text || !text.trim()){
      if(msg) msg.textContent = 'الملف لا يحتوي على نص قابل للقراءة.';
      return;
    }
    state.knowledgeDocs.push({ id: nextId('kb'), name: file.name, text: text.trim(), addedAt: todayISO() });
    if(msg) msg.textContent = `تمت إضافة "${file.name}" (${Math.round(text.length/1000)} ألف حرف تقريبًا)`;
    render();
    saveDataToDrive();
  } catch(e){
    if(msg) msg.textContent = 'صيغة غير مدعومة — الملفات المدعومة: PDF, Word (.docx), نص (.txt)';
  }
}

function removeKnowledgeDoc(id){
  state.knowledgeDocs = state.knowledgeDocs.filter(d => d.id !== id);
  render();
  saveDataToDrive();
}

async function sendChatMessage(text){
  if(!text || !text.trim() || state.chatBusy) return;
  state.chatMessages.push({ role: 'user', content: text.trim() });
  state.chatBusy = true;
  render();

  const knowledgeContext = state.knowledgeDocs.length
    ? state.knowledgeDocs.map(d => `--- ملف: ${d.name} ---\n${d.text}`).join('\n\n')
    : '';
  const systemPrompt = knowledgeContext
    ? `أنت مساعد ذكي متخصص بنظام العمل واللائحة التنفيذية لمعهد وتيرا. أجب على أسئلة المستخدم بالاعتماد على المستندات المرجعية التالية فقط قدر الإمكان، واذكر أي مادة أو بند إن أمكن. لو السؤال خارج نطاق المستندات، وضّح ذلك بصراحة قبل أي إجابة عامة.\n\nالمستندات المرجعية:\n${knowledgeContext}`
    : `أنت مساعد ذكي لمعهد وتيرا. لا توجد أي مستندات مرجعية مرفوعة بعد — أخبر المستخدم إنه يحتاج يرفع ملف نظام العمل أو اللائحة التنفيذية أولاً من نفس الصفحة قبل ما تقدر تجاوب بدقة، ثم أجب بأفضل ما تعرف بشكل عام.`;

  try{
    const apiMessages = state.chatMessages.slice(-20).map(m => ({ role: m.role, content: m.content }));
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: apiMessages,
      }),
    });
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
    const replyText = textBlocks.join('\n') || 'تعذّر الحصول على رد، حاول مرة أخرى.';
    state.chatMessages.push({ role: 'assistant', content: replyText });
  } catch(e){
    state.chatMessages.push({ role: 'assistant', content: 'حصل خطأ بالاتصال، حاول مرة أخرى.' });
  }
  state.chatBusy = false;
  render();
  saveDataToDrive();
  setTimeout(()=>{
    const box = document.getElementById('chatScrollBox');
    if(box) box.scrollTop = box.scrollHeight;
  }, 30);
}

نتدب بدل انتداب يومي بحسب درجته الوظيفية وموقع الانتداب (داخل المملكة أو خارجها). ودرجة الإركاب بالطائرة تُحدد وفق الفئة الوظيفية: الدرجة الأولى للقيادة العليا، ودرجة رجال الأعمال للإدارة الوسطى، ودرجة الاقتصادية لبقية الموظفين.", "swa_article": "المواد (32-35) – الانتداب وتكاليف السفر | لائحة الهيئة السعودية للمياه", "swa_text": "يُصرف للموظف المنتدب بدل انتداب يومي بحسب موقع الانتداب: داخل المملكة من 600 إلى 2,500 ريال/يوم، وخارج المملكة من 1,200 إلى 3,500 ريال/يوم. ودرجة الإركاب: الدرجة الأولى للقيادة العليا (10-12)، ودرجة رجال الأعمال للإدارة الوسطى (7-9)، والاقتصادية لبقية الموظفين. ولا يجوز الانتداب أكثر من 90 يوماً متتالية.", "labor_article": "المادة (41) – بدل الانتداب | نظام العمل السعودي", "labor_text": "يستحق العامل المنتدب إلى مكان بعيد عن مقر عمله الأصلي بدل انتداب تُحدد قيمته باتفاق الطرفين أو بما تنص عليه لائحة تنظيم العمل، ويشمل ذلك تكاليف السفر والإقامة اللازمة لأداء المهمة."}, {"id": "EOS-061", "domain": "إنهاء الخدمة", "topic": "إنهاء الخدمة والاستقالة", "keywords": ["استقالة", "إنهاء خدمة", "فسخ", "إخطار", "خروج نهائي", "استقال خارج المملكة", "استقال وهو خارج المملكة", "اجنبي", "غير سعودي"], "article": "المواد (61-63)", "clause": "إنهاء الخدمة والاستقالة", "source": "لائحة تنظيم العمل بالهيئة", "confidence": "🟢 نص مفهرس جزئياً", "answer": "تعالج الاستقالة أو الإنهاء وفق نوع العقد، الإشعار، مدة الخدمة، سبب الانتهاء، وحالة الموظف. للموظف غير السعودي خارج المملكة يجب إضافة حالة الإقامة/التأشيرة والعهد قبل المخالصة النهائية.", "ref": "المواد (61-63) مفهرسة سابقاً في قاعدة لائحة الهيئة، مع نظام العمل كمرجع مساند للإنهاء والاستقالة.", "risks": ["قبول استقالة غير مكتوبة", "تسوية دون إغلاق العهد", "إهمال التأشيرة والإقامة", "احتساب مكافأة نهاية الخدمة بشكل خاطئ"], "steps": ["تحقق من العقد", "حدد تاريخ الاستقالة", "احسب الإشعار والمستحقات", "أغلق العهد والتأشيرة"]}, {"id": "EOS-CALC", "domain": "إنهاء الخدمة", "topic": "مكافأة نهاية الخدمة", "keywords": ["مكافأة نهاية الخدمة", "نهاية الخدمة", "ثلث", "ثلثين", "سبع سنوات", "7 سنوات", "ثلاث سنوات", "3 سنوات"], "article": "المادة (64) – مكافأة نهاية الخدمة", "clause": "احتساب المكافأة", "source": "نظام العمل مرجع مساند مع لائحة الهيئة", "confidence": "🟢 قاعدة حسابية نظامية", "answer": "المكافأة الكاملة: نصف أجر عن كل سنة من السنوات الخمس الأولى، وأجر شهر عن كل سنة بعدها. في الاستقالة: أقل من سنتين لا يستحق، من سنتين إلى أقل من خمس يستحق الثلث، من خمس إلى أقل من عشر يستحق الثلثين، ومن عشر فأكثر يستحق كامل المكافأة.", "ref": "قاعدة الحساب مستندة إلى نظام العمل، وتظهر داخل Copilot لأنها حاسبة تنفيذية مرتبطة بإنهاء الخدمة في لائحة الهيئة.", "risks": ["استخدام الأساسي بدل الأجر المحتسب", "نسيان كسور السنة", "تطبيق حكم الاستقالة على إنهاء من صاحب العمل"], "steps": ["حدد سبب الانتهاء", "حدد الأجر المحتسب", "احسب مدة الخدمة", "طبق نسبة الاستحقاق"], "text": "يستحق الموظف عند انتهاء خدمته مكافأة نهاية خدمة تُحسب على النحو الآتي: نصف الأجر الفعلي الشهري عن كل سنة من السنوات الخمس الأولى، وأجر فعلي شهري كامل عن كل سنة من السنة السادسة فما بعدها. وعند الاستقالة: أقل من سنتين لا يستحق، ومن سنتين إلى خمس سنوات يستحق ثلث المكافأة، ومن خمس إلى عشر سنوات يستحق ثلثي المكافأة، وعشر سنوات فأكثر يستحق المكافأة كاملة.", "swa_article": "المادة (64) – مكافأة نهاية الخدمة | لائحة الهيئة السعودية للمياه", "swa_text": "يستحق الموظف عند انتهاء خدمته مكافأة نهاية خدمة تُحسب على النحو الآتي: نصف الأجر الفعلي الشهري عن كل سنة من السنوات الخمس الأولى، وأجر فعلي شهري كامل عن كل سنة من السنة السادسة فما بعدها. وعند الاستقالة: أقل من سنتين لا يستحق، ومن سنتين إلى خمس سنوات يستحق ثلث المكافأة، ومن خمس إلى عشر سنوات يستحق ثلثي المكافأة، وعشر سنوات فأكثر يستحق المكافأة كاملة. وتُصرف المكافأة للعاملة كاملة إذا استقالت خلال ستة أشهر من الزواج أو ثلاثة أشهر من الوضع.", "labor_article": "المادة (84) – مكافأة نهاية الخدمة | نظام العمل السعودي", "labor_text": "إذا انتهت علاقة العمل وجب على صاحب العمل أن يدفع للعامل مكافأة عن مدة خدمته، تحسب على أساس أجر نصف شهر عن كل سنة من السنوات الخمس الأولى، وأجر شهر عن كل سنة مما زاد على ذلك، ويتخذ الأجر الأخير أساساً لحساب المكافأة."}, {"id": "DISC-054", "domain": "المساءلة", "topic": "كف اليد والإيقاف والتحقيق", "keywords": ["كف اليد", "إيقاف", "تحقيق", "مخالفة", "جزاء", "موقوف", "احتجاز"], "article": "المواد (54-59)", "clause": "كف اليد والإيقاف", "source": "لائحة تنظيم العمل بالهيئة", "confidence": "🟢 نص مفهرس", "answer": "كف اليد أو الإيقاف إجراء احترازي مرتبط بمخالفة أو تحقيق، ولا يعامل كعقوبة نهائية إلا بعد اكتمال الإجراءات وصدور قرار صاحب الصلاحية.", "ref": "المواد (54-59) مفهرسة في قاعدة معرفة لائحة الهيئة.", "risks": ["إيقاف دون قرار مكتوب", "عدم تمكين الموظف من الرد", "تجاوز مدة الإجراء الاحترازي"], "steps": ["وثق الواقعة", "أصدر قرار الإحالة/الإيقاف", "استمع للأطراف", "أصدر القرار النهائي"]}, {"id": "GRV-001", "domain": "التظلمات", "topic": "التظلم والاعتراض", "keywords": ["تظلم", "اعتراض", "شكوى", "لجنة", "رفض التظلم", "محكمة عمالية"], "article": "المادة (72) – التظلمات", "clause": "إجراءات التظلم", "source": "لائحة تنظيم العمل بالهيئة", "confidence": "🟡 مفهرس موضوعياً", "answer": "التظلم يعالج بإجراء مكتوب يضمن سماع الأطراف والرد خلال المدة المحددة. إذا رفض التظلم أو لم يقتنع الموظف، يحال للمسار النظامي وفق المدة المحددة.", "ref": "باب التظلمات في اللائحة، مع ما ورد في قاعدة المعرفة السابقة عن اللجوء للمحاكم العمالية خلال 30 يوماً عند رفض التظلم.", "risks": ["عدم الرد كتابياً", "عدم تشكيل لجنة محايدة", "فوات مدة الاعتراض"], "steps": ["استقبل التظلم", "شكل لجنة أو مسار مراجعة", "وثق الرد", "أبلغ الموظف بالنتيجة"], "text": "يحق لكل موظف تقديم تظلم من أي قرار أو إجراء يتعلق بعمله خلال (30) يوماً من تاريخ علمه به. وعلى الجهة المختصة البتّ في التظلم خلال (15) يوماً من تاريخ تقديمه. وفي حال عدم الرد، أو في حال رفض التظلم، يحق للموظف اللجوء للجهات المختصة.", "swa_article": "المادة (72) – التظلمات والشكاوى | لائحة الهيئة السعودية للمياه", "swa_text": "يحق لكل موظف تقديم تظلم من أي قرار أو إجراء يتعلق بعمله خلال (30) يوماً من تاريخ علمه به كتابةً إلى رئيسه المباشر أو إلى من هو أعلى منه. وعلى الجهة المختصة البتّ في التظلم خلال (15) يوماً من تاريخ تقديمه. وفي حال الرفض أو انتهاء المهلة دون رد يحق للموظف اللجوء للجهات المختصة.", "labor_article": "المواد (39-41) – الشكاوى العمالية | نظام العمل السعودي", "labor_text": "إذا وقع خلاف بين صاحب العمل والعامل فعلى الطرف المتضرر رفع شكوى إلى مكتب العمل المختص، فإن لم يُسوَّ الخلاف خلال واحد وعشرين يوماً أُحيل إلى المحكمة العمالية للفصل فيه."}, {"id": "TRAIN-001", "domain": "التدريب والتطوير", "topic": "التدريب والابتعاث", "keywords": ["تدريب", "ابتعاث", "دورة", "تطوير", "مؤتمر", "تعليم"], "article": "المواد (29-31) – التدريب والتطوير", "clause": "التدريب والابتعاث", "source": "لائحة تنظيم العمل بالهيئة", "confidence": "🟡 مفهرس موضوعياً", "answer": "التدريب والابتعاث يرتبطان بحاجة العمل، توفر الميزانية، موافقة صاحب الصلاحية، والتزام الموظف بما يترتب على التدريب من حضور أو نقل معرفة أو التزام خدمة عند وجود نص.", "ref": "باب التدريب والتطوير في اللائحة.", "risks": ["اختيار تدريب غير مرتبط بالوظيفة", "عدم توثيق العائد من التدريب", "عدم وضوح التزام الموظف بعد الابتعاث"], "steps": ["حدد الاحتياج", "اربطه بالوصف الوظيفي", "اعتمد الميزانية", "وثق المخرجات"], "text": "تلتزم الهيئة بتأهيل موظفيها وتطوير قدراتهم من خلال برامج التدريب والابتعاث. وعلى الموظف المبتعث الالتزام بمتطلبات الابتعاث، وفي حال الإخلال بالالتزامات يجوز مطالبته بالتكاليف المصروفة.", "swa_article": "المواد (29-31) – التدريب والابتعاث | لائحة الهيئة السعودية للمياه", "swa_text": "تلتزم الهيئة بتأهيل موظفيها وتطوير قدراتهم. يُصرف للموظف المُلحق ببرامج تدريبية أجره كاملاً وتُغطى جميع التكاليف. وعلى الموظف المبتعث الالتزام بالعمل في الهيئة مدة مماثلة لمدة الابتعاث. وفي حال الإخلال بالالتزامات يجوز مطالبته بالتكاليف المصروفة.", "labor_article": "المادة (14) – التدريب والتأهيل | نظام العمل السعودي", "labor_text": "يجوز لصاحب العمل اشتراط بقاء العامل في خدمته لمدة معينة بعد تدريبه، فإن أنهى العامل العقد قبل انتهاء تلك المدة بدون سبب مشروع التزم بأداء ما أنفقه صاحب العمل على تدريبه."}, {"id": "CONTRACT-001", "domain": "العقود", "topic": "عقد العمل والتجديد", "keywords": ["عقد", "تجديد عقد", "مدة العقد", "غير سعودي", "انتهاء عقد", "عقد محدد"], "article": "المواد (9-11) – العقود وفترة التجربة", "clause": "عقد العمل", "source": "لائحة تنظيم العمل بالهيئة", "confidence": "🟡 مفهرس موضوعياً", "answer": "العقد هو مرجع العلاقة الفردية بجانب اللائحة. عند التعامل مع غير السعودي يجب مراجعة مدة العقد، الإقامة، التأشيرة، وشرط التجديد أو الإنهاء قبل أي قرار.", "ref": "باب التوظيف والعقود في اللائحة، مع نظام العمل كمرجع مساند للعقود.", "risks": ["استمرار العمل بعد انتهاء العقد دون تجديد", "عدم مواءمة العقد مع الإقامة", "تعديل جوهري دون موافقة مكتوبة"], "steps": ["راجع العقد", "حدد تاريخ الانتهاء", "راجع الإقامة والتأشيرة", "قرر التجديد أو الإنهاء"], "text": "لا تزيد فترة التجربة على (مئة وثمانين يوماً)، ولا تُحتسب فيها إجازات الأعياد والإجازة المرضية. وللطرفين إنهاء العقد خلال فترة التجربة دون إشعار مسبق ودون استحقاق مكافأة نهاية الخدمة.", "swa_article": "المواد (9-11) – العقود وفترة التجربة | لائحة الهيئة السعودية للمياه", "swa_text": "لا تزيد فترة التجربة على (180) يوماً. ولا تُحتسب في فترة التجربة إجازات الأعياد الرسمية والإجازة المرضية. وللطرفين إنهاء العقد خلال فترة التجربة دون إشعار مسبق ودون استحقاق مكافأة نهاية الخدمة. ويجب أن ينص العقد صراحةً على فترة التجربة وإلا اعتُبر الموظف مثبتاً.", "labor_article": "المادة (53) – فترة التجربة | نظام العمل السعودي", "labor_text": "يجوز الاتفاق على أن يخضع العامل لفترة تجربة لا تتجاوز تسعين يوماً، ويجوز تمديدها تسعين يوماً أخرى بموافقة كتابية. وإذا أنهى أحد الطرفين العقد خلال فترة التجربة فلا يستحق العامل مكافأة نهاية خدمة ولا تعويضاً."}, {"id": "DATA-001", "domain": "جودة المعرفة", "topic": "توثيق المادة والبند", "keywords": ["رقم المادة", "البند", "وين النص", "المرجع", "النص الأصلي", "الصفحة"], "article": "إجراء ضبط المعرفة", "clause": "عدم اختراع المواد", "source": "Controlled Knowledge", "confidence": "🟢 قاعدة أمان", "answer": "لا يعرض Copilot رقم مادة أو بند إلا إذا كان مفهرساً في قاعدة المعرفة. إذا كان النص موجوداً في اللائحة لكنه غير مفهرس، يطلب الصفحة أو المادة للتحقق ولا يضيفه تلقائياً من المحادثة.", "ref": "هذه قاعدة تشغيلية لضمان عدم اختراع مواد أو أرقام بنود.", "risks": ["نسبة مادة غير صحيحة للائحة", "تحديث غير معتمد من حة التنفيذية لنظام العمل", "confidence": "🟢 نص مفهرس", "answer": "نقل خدمات العامل غير السعودي يخضع لضوابط محددة تشمل السن وتوفر شروط الاستقدام ونسب التوطين، ولا يجوز نقل الخدمات بلا موافقة إلكترونية من صاحب العمل أو تنازل ورقي مصادق عليه إلا في حالات استثنائية محددة نظامًا.", "ref": "المادة (41) من نظام العمل، المادة (14) من اللائحة التنفيذية.", "risks": ["نقل خدمات دون تحقق نسبة التوطين", "نقل خدمات عامل من جنسية ممنوع نقل خدماتها نظامًا", "إغفال الموافقة الإلكترونية أو التنازل الورقي المصادق"], "labor_article": "المادة (41) من نظام العمل", "labor_text": "تحدد اللائحة شروط الاستقدام ونقل الخدمات وتغيير المهنة وضوابط ذلك وإجراءاته. ولا يجوز نقل خدمات العامل دون موافقة إلكترونية من صاحب العمل أو تنازل ورقي مصادق عليه من جهة رسمية، إلا في حالات استثنائية (كنقل الخدمات دون موافقة المنصوص عليها في اللائحة وبرنامج نطاقات، أو عقود المقاولات الحكومية المستمرة)."}, {"id": "NITAQAT-001", "domain": "التوطين", "topic": "برنامج نطاقات ونسب التوطين", "keywords": ["نطاقات", "توطين", "نسبة التوطين", "سعودة", "برنامج نطاقات"], "article": "تنفيذية المادة (26)", "clause": "التوطين", "source": "اللائحة التنفيذية لنظام العمل", "confidence": "🟢 نص مفهرس", "answer": "تُحدَّد نسب التوطين الواجب على المنشآت تحقيقها عبر برنامج تحفيز المنشآت لتوطين الوظائف (نطاقات)، ويترتب على عدم تحقيق النسبة حجب كل أو بعض خدمات الوزارة عن المنشأة، بما يؤثر على قدرتها على الاستقدام أو نقل الخدمات.", "ref": "المادة (26) من نظام العمل، المادة (8) من اللائحة التنفيذية.", "risks": ["استقدام أو نقل خدمات يخفض نسبة التوطين", "إغفال تحديثات برنامج نطاقات الدورية", "عدم احتساب العاملين بعقود جزئية أو مرنة ضمن النسبة بشكل صحيح"], "labor_article": "المادة (26) من نظام العمل", "labor_text": "تحدد نسب التوطين لدى المنشآت الواجب تحقيقها من خلال برامج تضعها الوزارة، تُتابع من خلالها نسب التوطين لكل نشاط، مع حجب كل أو بعض خدمات الوزارة عن المنشآت التي لا تحقق النسبة المحددة (مثل برنامج نطاقات)، وتُحدَّث هذه النسب دوريًا."}, {"id": "PARTTIME-001", "domain": "العقود", "topic": "عقد العمل لبعض الوقت", "keywords": ["عمل لبعض 001", "domain": "السلامة", "topic": "إصابات العمل والإبلاغ عنها", "keywords": ["إصابة عمل", "حادث عمل", "تقرير طبي", "عجز", "إصابة أثناء العمل"], "article": "المادة (141 بعد المائة)", "clause": "إصابات العمل", "source": "اللائحة التنفيذية لنظام العمل", "confidence": "🟢 نص مفهرس", "answer": "يجب على صاحب العمل إبلاغ مكتب العمل المختص عن أي إصابة عمل خلال أسبوع من تاريخ العلم بها، ويتولى مكتب العمل التحقق من طبيعة الإصابة والإحالة لجهة طبية حكومية عند الحاجة لتحديد نسبة العجز.", "ref": "المادة (141 بعد المائة) من نظام العمل، المادة (28) من اللائحة التنفيذية.", "risks": ["تأخر الإبلاغ عن أسبوع من العلم بالإصابة", "عدم الإحالة لجهة طبية حكومية عند غياب تقرير رسمي", "إغفال إجراءات فرع الأخطار المهنية بالتأمينات"], "labor_article": "المادة (141 بعد المائة) من نظام العمل", "labor_text": "في حال عدم خضوع المنشأة لفرع الأخطار المهنية بالتأمينات الاجتماعية، يقوم صاحب العمل بإبلاغ مكتب العمل المختص عن إصابة العامل خلال أسبوع من تاريخ علمه بها، ويتحقق مكتب العمل من كون الإصابة إصابة عمل وفق التقارير الرسمية، وإذا لم يتوفر تقرير طبي يحدد نسبة العجز يحيل المصاب إلى مستشفى حكومي."}, {"id": "RECRUIT-001", "domain": "التوظيف", "topic": "شروط وضوابط الاستقدام", "keywords": ["استقدام", "استقطاب عمالة", "تأشيرة عمل", "استقدام وافد"], "article": "المادة (41) – تنفيذية (14)", "clause": "الاستقدام", "source": "اللائحة التنفيذية لنظام العمل", "confidence": "🟢 نص مفهرس", "answer": "لا يجوز أن يؤدي الاستقدام إلى منافسة العمالة السعودية أو إقصائها عن العمل، ولا يُعتبر عجز صاحب العمل عن استقطاب سعوديين مبررًا للاستقدام، ويُشترط تحقيق نسبة التوطين المطلوبة ببرنامج نطاقات قبل الاستقدام.", "ref": "المادة (41) من نظام العمل، المادة (14) من اللائحة التنفيذية.", "risks": ["استقدام يقصي عمالة سعودية عن مهنة معينة", "استقدام يخفض نسبة التوطين دون المستوى المطلوب", "اعتبار العجز عن التوطين مبررًا للاستقدام خطأً"], "labor_article": "المادة (41) من نظام العمل", "labor_text": "لا يجوز أن يؤدي الاستقدام إلى منافسة العمالة السعودية أو إقصائها عن العمل في مهنة أو مجموعة مهن أو أنشطة. ولا يُعد عجز صاحب العمل  (36) – الخصومات من الراتب | لائحة الهيئة السعودية للمياه", "swa_text": "لا يجوز خصم أي مبلغ من أجر الموظف إلا في حالات الخصومات النظامية المقررة كاشتراكات التأمينات الاجتماعية، والسلف الموافق عليها، والجزاءات التأديبية المعتمدة وفق جدول الجزاءات. ولا يجوز في أي حال أن تتجاوز الخصومات نصف الأجر الشهري.", "labor_article": "المادة (100) – الخصومات من الأجر | نظام العمل السعودي", "labor_text": "لا يجوز لصاحب العمل أن يقتطع من أجر العامل وفاءً لدين له عليه أكثر من عشرة بالمئة من الأجر، ولا يجوز أن تتجاوز مجموع الاقتطاعات نصف الأجر الشهري إلا إذا ثبت أن العامل هو المتسبب في الضرر."}, {"id": "POLICY-EOS-2025", "domain": "نهاية الخدمة", "topic": "سياسة نهاية الخدمة 2025", "keywords": ["نهاية الخدمة", "مكافأة نهاية", "انهاء العقد", "فسخ العقد", "استقالة", "تقاعد", "وفاة العامل", "كف اليد", "انقطاع عن العمل", "شهادة الخدمة", "نقل الكفالة"], "article": "سياسة نهاية الخدمة – الإصدار الأول، أغسطس 2025", "clause": "المواد 1-17", "source": "سياسة نهاية الخدمة – وكالة رأس المال البشري", "confidence": "🟢 نص رسمي معتمد", "answer": "سياسة نهاية الخدمة 2025 تغطي جميع حالات وأحكام انتهاء خدمة العاملين بالهيئة.", "ref": "سياسة نهاية الخدمة – وكالة رأس المال البشري، أغسطس 2025", "swa_article": "سياسة نهاية الخدمة – وكالة رأس المال البشري (أغسطس 2025)", "swa_text": "المادة الأولى – حالات انتهاء خدمة العامل: (1) عدم إتمام فترة التجربة. (2) انتهاء مدة العقد ما لم يتفق الطرفان على تجديده كتابياً. (3) اتفاق الهيئة والعامل كتابياً على إنهاء العقد أثناء سريانه. (4) استقالة العامل مع مراعاة المدة المحددة في النظام. (5) فسخ العقد لأحد الأسباب الواردة في النظام. (6) عجز العامل كلياً عن أداء العمل المتفق عليه وثبوت ذلك بتقرير طبي معتمد. (7) وفاة العامل. (8) إلغاء رخصة عمل العامل غير السعودي أو إقامته أو رفض تجديدها أو إبعاده. (9) بلوغ سن التقاعد ما لم تتفق الهيئة مع العامل على خلاف ذلك. (10) القوة القاهرة. (11) إنهاء النشاط الذي يعمل فيه العامل. (12) أي حالة أخرى منصوص عليها في الأنظمة. المادة الثانية – عدم اجتياز فترة التجربة: لا يزيد مجموع مدة التجربة على 180 يوماً، ولكلا الطرفين إنهاء العقد خلالها دون إشعار مسبق ودون استحقاق مكافأة نهاية الخدمة. المادة الرابعة – استقالة العامل: (1) لعقد غير محدد المدة: يُشعر الهيئة بمدة لا تقل عن 30 يوماً. (4) يُعد طلب الاستقالة مقبولاً إذا مضى 30 يوماً دون رد. (5) للهيئة تأجيل قبول الاستقالة لمدة لا تزيد على 60 يوماً. (6) يجوز للعامل العدول خلال 7 أيام من تقديمها. المادة الخامسة – إنهاء العقد من قِبل الهيئة: لعقد غير محدد المدة يجب إشعار العامل كتابياً بمدة لا تقل عن 60 يوماً. المادة السادسة – فسخ العقد: يحق للهيئة فسخ العقد دون مكافأة أو إشعار في حالات: (1) الاعتداء الجسدي. (2) عدم أداء الالتزامات الجوهرية أو مخالفة التعليمات رغم الإنذار. (3) السلوك السيئ أو الأمانة. (4) الإضرار المتعمد. (5) التزوير. (6) كان تحت التجربة. (7) الغياب دون سبب مشروع أكثر من 30 يوماً في السنة أو 15 يوماً متصلة بعد إنذار كتابي. (8) استغلال المركز الوظيفي. (9) إفشاء الأسرار. المادة الخامسة عشر – مكافأة نهاية الخدمة: (1) نصف الأجر الفعلي الشهري الأخير عن كل سنة من سنوات الخمس الأولى. (2) كامل الأجر الفعلي الشهري الأخير عن كل سنة من السنة السادسة وما يليها. عند الاستقالة: لا يستحق إذا أقل من سنتين، ثلث الكافأة من 2 إلى 5 سنوات، ثلثي الكافأة من 5 إلى 10 سنوات، كاملة من 10 سنوات فأكثر. المادة السادسة عشر – شهادة الخدمة: يحق للعامل الحصول على شهادة خدمة تبين مدة عمله وآخر منصب وأجره الفعلي. المادة السابعة عشر – نقل الكفالة: يحق للعامل غير السعودي الحصول على نقل كفالة بموافقة صاحب الصلاحية خلال شهر من تاريخ الخطاب وتتحمل الجهة الجديدة تكاليف النقل.", "labor_article": "نظام العمل السعودي – المواد ذات الصلة", "labor_text": "المادة (84): مكافأة نهاية الخدمة تُحسب على أجر نصف شهر عن كل سنة من الخمس الأولى وأجر شهر عن كل سنة مما زاد. المادة (80): حالات فسخ العقد دون مكافأة أو إشعار. المادة (81): يحق للعامل ترك العمل دون إشعار مع احتفاظه بحقوقه في حالات محددة."}, {"id": "POLICY-CHILD-EDU-2025", "domain": "البدلات", "topic": "بدل تعليم الأبناء 2025", "keywords": ["بدل تعليم", "تعليم الابناء", "تعليم ابنائي", "بدل تعليم الأبناء", "رسوم مدرسة", "مصاريف تعليم"], "article": "ضوابط صرف بدل تعليم الأبناء – الإصدار الثاني، يناير 2025", "clause": "المواد 1-15", "source": "ضوابط صرف بدل تعليم الأبناء – وكالة رأس المال البشري", "confidence": "🟢 نص رسمي معتمد", "answer": "بدل تعليم الأبناء يُصرف للعاملين السعوديين المستحقين وفق ضوابط محددة.", "ref": "ضوابط صرف بدل تعليم الأبناء – وكالة رأس المال البشري، يناير 2025", "swa_article": "ضوابط صرف بدل تعليم الأبناء – وكالة رأس المال البشري (يناير 2025)", "swa_text": "نطاق التطبيق: تسري الضوابط على العاملين السعوديين على كادر التشغيل والصيانة الخاضعين لنظام العمل. شروط الاستحقاق (المادة التاسعة): (أ) أن يكون العامل على رأس العمل. (ب) أن تتراوح أعمار الأبناء بين 5-18 سنة في بداية التقويم الدراسي. (ج) التحاق الأبناء بمدرسة خاصة داخل المملكة وفق بيانات منصة نور لوزارة التعليم. قيمة البدل (المادة السابعة): الدرجات 11 و12: 25,000 ريال/ابن، حد أقصى 3 أبناء. الدرجات 8 و9 و10: 20,000 ريال/ابن، حد أقصى 3 أبناء. الدرجة 7 فأقل: 15,000 ريال/ابن، حد أقصى 2 ابن. الاستحقاق (المادة الثامنة): يُصرف بما لا يتجاوز القيمة المستحقة لكل ابن/ابنة بشكل منفصل. لا يجوز دفع القيمة الكاملة أو المبلغ المتبقي بأي حال. ما يُصرف: رسوم التسجيل، القسط المدرسي، الكتب المدرسية. ما لا يُصرف: الامتحانات، الرحلات، الأنشطة، الدروس الإضافية. الإجراءات (المادة العاشرة): تقديم الطلب خلال شهرين من الإعلان، إرفاق فواتير رسمية ومستندات داعمة، تسجيل جميع الأبناء في طلب واحد. إذا كان الزوجان موظفَين بالهيئة يُصرف لأحدهما فقط (المادة الثالثة عشرة). العمال اللي انتهت علاقتهم قبل الإعلان لا يستحقون (المادة الرابعة عشرة).", "labor_article": "نظام العمل السعودي – بدل تعليم الأبناء", "labor_text": "لا ينص نظام العمل السعودي على بدل تعليم الأبناء بشكل مباشر، وهو من المزايا الإضافية التي تمنحها الهيئة وفق سياستها الداخلية لعاملي كادر التشغيل والصيانة."}, {"id": "POLICY-WORKPLACE-2025", "domain": "بيئة العمل", "topic": "سياسة بيئة العمل وثقافة المنظمة 2025", "keywords": ["بيئة عمل", "ثقافة المنظمة", "مكتب العامل", "ترتيب المكتب", "نظافة المكتب", "حياة موظف", "ظهور احترافي", "قيم المنظمة", "شفافية", "نزاهة", "أخلاقيات"], "article": "سياسة بيئة العمل وثقافة المنظمة – الإصدار الأول، أغسطس 2025", "clause": "المادتان الأولى والثانية", "source": "سياسة بيئة العمل وثقافة المنظمة – وكالة رأس المال البشري", "confidence": "🟢 نص رسمي معتمد", "answer": "تهدف السياسة لتوفير بيئة عمل إيجابية وآمنة تعزز أداء العاملين ورضاهم وتدعم ثقافة مؤسسية قائمة على القيم الأخلاقية والمشتركة.", "ref": "سياسة بيئة العمل وثقافة المنظمة – وكالة رأس المال البشري، أغسطس 2025", "swa_article": "سياسة بيئة العمل وثقافة المنظمة – وكالة رأس المال البشري (أغسطس 2025)", "swa_text": "المادة الأولى – بيئة العمل: (1) البيئة المكتبية: تصميم مساحات تعزز التعاون مع توفير الخصوصية، اختيار أثاث وتجهيزات مناسبة، ضمان بنية تقنية متطورة، توفير تهوية جيدة، ضمان الأمن والخصوصية، تطبيق معايير الأمن والسلامة. (2) البيئة التشاركية: توفير مناطق هادئة وأماكن راحة، غرف اجتماعات كبيرة وصغيرة، مناطق صلاة، أماكن استراحة مريحة، مواقف ذوي الإعاقة. (3) البيئة التقنية: توفير حاسبات عالية الأداء، إجراءات أمنية لحماية البيانات، دعم العمل عن بُعد، توافق الأجهزة والأنظمة. (4) البيئة الصحية والآمنة: توفير مرافق صحية متكاملة، خزانات إسعافات أولية، تطبيق معايير الأمن والسلامة، تقييم دوري للمخاطر، إعداد خطط طوارئ. المادة الثانية – ثقافة المنظمة: (1) الشفافية والنزاهة والعمل الجماعي: نشر تقارير دورية توضح أداء الهيئة وقراراتها، تعزيز التواصل الفعّال بين العاملين والإدارات، وضع سياسات للحد من تعارض المصالح، الالتزام بالتدقيق والمراجعة الدورية، ضمان العدل والمساواة، تخصيص قنوات آمنة لاستقبال المقترحات والشكاوى، مكافحة الرشوة بكافة أشكالها، عدم قبول الهدايا التي قد تؤثر على النزاهة. (2) القيم الأخلاقية: تنظيم ورش عمل لتعزيز الوعي بالسلوك المهني، تضمين مدونة السلوك الوظيفي في عقد العمل، تشجيع الابتكار والإبداع، توفير توازن بين العمل والحياة، تحفيز المتميزين، تنظيم آلية سنوية لتكريم أفضل الفرق والأفراد.", "labor_article": "نظام العمل السعودي – بيئة العمل", "labor_text": "المادة (121) من نظام العمل: يجب على صاحب العمل توفير وسائل الحماية والسلامة المهنية اللازمة للعامل في مكان العمل وفق المعايير المقررة، والالتزام بالتعليمات الصادرة من الجهات المختصة بشأن الصحة المهنية."}, {"id": "POLICY-OFFICE-2024", "domain": "بيئة العمل", "topic": "سياسة مكتب العامل 2024", "keywords": ["مكتب العامل", "نظافة المكتب", "ترتيب المكتب", "وثائق على المكتب", "أجهزة كهربائية مكتب", "تدخين في العمل", "مظهر احترافي"], "article": "سياسة مكتب العامل – الإصدار الأول، أكتوبر 2024", "clause": "المواد 1-28", "source": "سياسة مكتب العامل – وكالة رأس المال البشري", "confidence": "🟢 نص رسمي معتمد", "answer": "سياسة مكتب العامل تنظّم كيفية تعامل العامل مع مساحة المكتب والبيئة المحيطة والأجهزة.", "ref": "سياسة مكتب العامل – وكالة رأس المال البشري، أكتوبر 2024", "swa_article": "سياسة مكتب العامل – وكالة رأس المال البشري (أكتوبر 2024)", "swa_text": "المادة الأولى: على جميع من تطبق عليهم السياسة الالتزام بالتعاميم والأنظمة، وفي حال المخالفة يكون عرضة للجزاء وفق جدول المخالفات. المادة الثانية: يلتزم العامل بترتيب مساحة العمل بشكل دوري وترك الكتب نظيفاً قبل مغادرة مقر العمل. المادة الثالثة: عدم ترك أي معلومة سرية أو أجهزة تخزين دون رقابة. المادة الرابعة: عدم ترك أي وثائق على الطابعات أو الماسحات الضوئية. المادة الخامسة: عدم وضع أو تعليق أي مواد غير ذات صلة بالعمل. المادة السادسة: تخزين الوثائق المتعلقة بالعمل في أماكن التخزين الخصصة فقط. المادة الثامنة: عدم إضافة أجهزة كهربائية إلا بموافقة جهة الاختصاص. المادة الحادية عشرة: تأمين جهاز الحاسب الآلي وإغلاقه قبل مغادرة الكتب. المادة الثانية عشرة: الحفاظ على المظهر الاحترافي وتجنب تناول المأكولات والمشروبات في غير الأماكن المخصصة. المادة الحادية والعشرون: عدم التدخين في محيط مكتب العمل أو أي أماكن أخرى غير مخصصة للتدخين. المادة الخامسة والعشرون: تسليم الكتب في الوقت المحدد عند طلب إخلائه. المادة الثامنة والعشرون: يجوز لجهة الاختصاص بحضور ممثل من الإدارة التنفيذية للأمن الصناعي فتح باب الكتب دون موافقة العامل الخطية لأسباب الصيانة أو وجود خطر.", "labor_article": "نظام العمل السعودي – واجبات العامل", "labor_text": "المادة (68) من نظام العمل: على العامل أن يحافظ على ممتلكات صاحب العمل وأن يؤدي عمله بإتقان وأن يراعي قواعد السلامة المقررة، وألا يفشي أسرار صاحب العمل."}, {"id": "POLICY-FACTORY-VISITS-2025", "domain": "الانتداب", "topic": "ضوابط الزيارات والاختبارات المصنعية 2025", "keywords": ["زيارة مصنعية", "اختبار مصنعي", "زيارة ميدانية", "فريق الكلف", "انتداب مصنعي", "تقرير الزيارة"], "article": "ضوابط الزيارات والاختبارات المصنعية – الإصدار الأول، مارس 2025", "clause": "الفصول الأول والثاني والثالث", "source": "ضوابط الزيارات والاختبارات المصنعية – وكالة رأس المال البشري", "confidence": "🟢 نص رسمي معتمد", "answer": "تنظّم هذه الضوابط الزيارات والاختبارات المصنعية للعاملين في الهيئة لضمان تنفيذها بشكل منهجي ومنظم.", "ref": "ضوابط الزيارات والاختبارات المصنعية – وكالة رأس المال البشري، مارس 2025", "swa_article": "ضوابط الزيارات والاختبارات المصنعية – وكالة رأس المال البشري (مارس 2025)", "swa_text": "الهدف: تنظيم وحوكمة الزيارات والاختبارات المصنعية لضمان تنفيذها بشكل منهجي ومنظم، وضمان تحقق الهدف وتبادل المعرفة بين أعضاء الفريق والعاملين. التزامات الوحدة التنظيمية: (2-1) إعداد جدول الزيارات ربع سنوياً مع تحديد أسماء الفريق. (3-1) رفع الزيارات غير المخططة لوكالة رأس المال البشري قبل 30 يوم عمل مع التسبيب. (4-1) مراعاة الجدارات الفنية عند تحديد الفريق الكلف. (5-1) وضع خطة فحص معتمدة مع الفريق قبل الزيارة. (6-1) تأهيل وتدريب الفريق قبل موعد الزيارة. شروط الزيارة العامة: (1-1) لا تتجاوز مدة الزيارة يومين غير شاملة أيام السفر. (2-1) لا يزيد الفريق عن 3 أشخاص. شروط الفريق الكلف (2-2): توافق المسمى الوظيفي مع الوكالة، يحمل بكالوريوس على الأقل، مضى سنة من التحاقه بالهيئة، لم يقم بزيارة مماثلة خلال 6 أشهر، لا يقل تقييم الأداء عن 3، لا تقل نسبة التواجد عن 85%، لم يوقع جزاء تأديبي آخر سنتين. التقارير: يرفع الفريق تقرير الزيارة للوحدة التنظيمية خلال 5 أيام عمل، وترفع الوحدة تقريراً لرئيس الهيئة خلال 15 يوم عمل.", "labor_article": "نظام العمل السعودي – الانتداب", "labor_text": "المادة (41) من نظام العمل: يستحق العامل المنتدب بدل انتداب تُحدد قيمته بالاتفاق أو بلائحة تنظيم العمل، ويشمل تكاليف السفر والإقامة اللازمة لأداء المهمة."}, {"id": "HARASSMENT-001", "domain": "سلوكيات العمل", "topic": "مكافحة التحرش والإيذاء في مكان العمل", "keywords": ["تحرش", "إيذاء", "خلوة", "اعتداء لفظي", "اعتداء جسدي", "شكوى تحرش", "لجنة تحقيق تحرش", "ابتزاز", "تهديد"], "article": "المادتان (4-هـ) و(5-ف،ص،ش،ت،ث،خ،ر)", "clause": "مكافحة التحرش والإيذاء", "source": "لائحة تنظيم العمل بالهيئة", "confidence": "🟢 نص مفهرس", "answer": "تلتزم الهيئة بتشكيل لجنة تحقيق خلال 5 أيام عمل من تلقي شكوى الإيذاء، وعلى الموظف غض البصر واحترام الساحة الشخصية للجنس الآخر والامتناع عن الخلوة معه، والإبلاغ عن أي واقعة إيذاء يعلم بها ولو لم يكن طرفاً فيها، مع الحفاظ على سرية المعلومات. من تعرض للإيذاء يقدم شكوى للإدارة المختصة خلال 5 أيام عمل من الواقعة (أو لأعلى سلطة إن كان مرتكب الإيذاء هو صاحب العمل نفسه).", "ref": "المادة (4-هـ) بشأن التزام الهيئة بتشكيل لجنة التحقيق، والمادة (5) بفقراتها المتعلقة بسلوكيات العامل تجاه التحرش والإيذاء.", "risks": ["عدم تشكيل لجنة تحقيق خلال المدة المحددة", "إفشاء هوية مقدم الشكوى أو المشتكى عليه قبل ثبوت الإدانة", "التعامل مع الشكوى الكيدية دون تحقق", "تجاوز الموظف للمدة النظامية (5 أيام) لتقديم شكواه"], "steps": ["استلم الشكوى كتابياً أو إلكترونياً", "شكّل لجنة تحقيق بقرار من المسؤول المختص", "اطّلع على الأدلة واسمع الأطراف", "أوصِ بالجزاء المناسب خلال 5 أيام عمل من تلقي البلاغ", "حافظ على سرية المعلومات طوال الإجراءات"], "swa_article": "المادتان (4) و(5) – مكافحة التحرش والإيذاء | لائحة الهيئة السعودية للمياه", "swa_text": "تلتزم الهيئة بتشكيل لجنة بقرار من المسؤول المختص عند تقديم شكوى متعلقة بالإيذاء بمكان العمل، تتولى التحقيق والاطلاع على الأدلة والتوصية بإيقاع الجزاء المناسب خلال (5) أيام عمل من تلقي الشكوى. ويلتزم العامل بغض البصر واحترام الساحة الشخصية للجنس الآخر، وعدم التطرق لمسائل شخصية خارج نطاق العمل جدياً أو مزاحاً، والامتناع عن الخلوة مع الجنس الآخر، والامتناع عن أي شكل من أشكال الإيذاء الجسدي أو اللفظي أو القولي أو الإيحائي سواء كان مباشراً أو عبر وسائل التواصل، والإبلاغ عن أي واقعة تحرش يُعلم بها ولو لم يكن طرفاً فيها، والمحافظة على سرية معلومات واقعة التحرش، والتعامل مع الشكوى الكيدية في حال ثبوتها والرفع للإدارة المختصة. وللعامل الذي وقع عليه إيذاء التقدم بشكوى للإدارة المختصة خلال (5) أيام عمل من الواقعة، وإذا كان مرتكب الإيذاء صاحب العمل أو من هو أعلى منه في السلطة فيُتقدم بالشكوى للجهة الحكومية المختصة مباشرة.", "labor_article": "نظام مكافحة التحرش (مرسوم ملكي رقم م/96 وتاريخ 1439/8/23هـ)", "labor_text": "يجرّم النظام كل فعل أو قول أو إشارة ذات دلالة أو إيحاء جنسي، بأي وسيلة كانت، ويوقع عقوبات السجن والغرامة بحسب جسامة الفعل، وتلتزم جهات العمل بتوفير قنوات آمنة لتلقي الشكاوى وحماية هوية المبلغ والمجني عليه."}, {"id": "SECOND-LOAN-001", "domain": "الإعارة والاستعارة", "topic": "إعارة العامل واستعارة عامل من جهة أخرى", "keywords": ["إعارة", "استعارة", "إعارة موظف", "نقل مؤقت لجهة أخرى", "العمل لدى جهة أخرى", "استعارة عامل"], "article": "المواد (24-27) – الباب السادس: الإعارة والاستعارة", "clause": "الإعارة والاستعارة", "source": "لائحة تنظيم العمل بالهيئة", "confidence": "🟢 نص مفهرس", "answer": "إعارة العامل لجهة أخرى تكون بموافقته وبقرار من المسؤول الأول (أو المجلس إن كان الاتفاق على تحمل التكاليف مختلفاً)، ويحتفظ بدرجته الوظيفية طوال مدة الإعارة، ولا تتجاوز سنة قابلة للتمديد بحد أقصى إجمالي 6 سنوات، ولا تجوز إعادة إعارته إلا بعد 3 سنوات من انتهاء الإعارة السابقة. أما استعارة عامل من جهة أخرى فتشترط وجود وظيفة شاغرة، وتوفر المؤهلات المناسبة، وموافقة جهته الأصلية، ويتقاضى أجره الفعلي المماثل لجهته الأصلية.", "ref": "الباب السادس (المواد 24-27) من لائحة تنظيم العمل بالهيئة.", "risks": ["إعارة دون موافقة كتابية من العامل", "تجاوز الحد الأقصى الإجمالي لمدة الإعارة (6 سنوات)", "استعارة عامل دون التحقق من مؤهلاته أو موافقة جهته الأصلية", "شغل وظيفة العامل المعار بشكل دائم دون مسوغ"], "steps": ["تحقق من موافقة العامل الكتابية على الإعارة", "حدد الجهة المتحملة للتكاليف والنسب المقررة", "اعتمد القرار من صاحب الصلاحية المناسب (المسؤول الأول أو المجلس)", "احتفظ بدرجة العامل الوظيفية طوال مدة الإعارة", "راجع مدة الإعارة وحدود التمديد قبل التجديد"], "swa_article": "المواد (24-27) – الإعارة والاستعارة | لائحة الهيئة السعودية للمياه", "swa_text": "يجوز إعارة العامل بعد موافقته للعمل لدى جهة أخرى داخل المملكة أو خارجها أو لدى منظمات دولية، وتكون بقرار من المسؤول الأول إن تحملت الجهة المستعيرة كامل التكاليف، وإلا فمن صلاحية المجلس. يحتفظ العامل المعار بدرجته الوظيفية طوال مدة الإعارة ولا يجوز شغلها بغيره إلا لمصلحة العمل. لا تزيد مدة الإعارة عن سنة قابلة للتمديد بمدد مماثلة بحد أقصى إجمالي (6) سنوات أو المدة المتبقية من عقد العامل محدد المدة، ولا تجوز إعارة من أكمل الحد الأقصى قبل مضي (3) سنوات على الأقل من انتهاء إعارته السابقة. أما استعارة عامل من جهة أخرى فتشترط: وجود وظيفة شاغرة تدعو الحاجة لشغلها، توفر المؤهلات والخبرات المناسبة للوصف الوظيفي المعتمد، موافقة جهة العامل الأصلية على إعارته، وتقاضيه أجراً فعلياً مماثلاً لأجره لدى جهته الأصلية. وللمسؤول الأول منح العامل المستعار مكافأة أداء سنوية وفق الضوابط النظامية المعتمدة."}, {"id": "OFFER-CONTRACT-001", "domain": "التوظيف", "topic": "العرض الوظيفي وتوقيع العقد وإلغاؤه قبل المباشرة", "keywords": ["عرض وظيفي", "توقيع عقد", "إلغاء عرض وظيفي", "عدم المباشرة", "لم يباشر العمل", "عقد بلغتين"], "article": "المواد (6-8) – الباب الثالث: العرض الوظيفي", "clause": "العرض الوظيفي والتعاقد", "source": "لائحة تنظيم العمل بالهيئة", "confidence": "🟢 نص مفهرس", "answer": "يُبلَّغ المرشح بالعرض الوظيفي بخطاب رسمي معتمد من صاحب الصلاحية، مناولة أو عبر بريده الإلكتروني. يُحرَّر العقد من نسختين باللغة العربية (ويجوز إضافة لغة أخرى مع اعتماد النص العربي عند التفسير)، وتودع نسخة في ملف الموظف. يجوز فسخ العقد أو إلغاء العرض لمن لا يباشر عمله دون عذر مشروع خلال 7 أيام عمل من تاريخ المباشرة المحدد (أو من تاريخ القدوم للمملكة إن كان التعاقد من خارجها).", "ref": "المواد (6-8) من لائحة تنظيم العمل بالهيئة.", "risks": ["إبلاغ العرض دون خطاب رسمي معتمد", "تحرير العقد بنسخة واحدة فقط دون إيداع نسخة في ملف الموظف", "التأخر في فسخ العقد بعد تجاوز مهلة السبعة أيام دون مبرر موثق", "الاعتماد على النسخة الأجنبية من العقد عند التعارض بدل العربية"], "steps": ["اعتمد خطاب العرض من صاحب الصلاحية", "أرسله للمرشح مناولة أو بريداً إلكترونياً", "حرّر العقد بنسختين عربيتين (ولغة إضافية عند الحاجة)", "سلّم نسخة للعامل وأودع الأخرى في ملفه", "راقب تاريخ المباشرة المحدد واحتسب مهلة السبعة أيام عند التخلف"], "swa_article": "المواد (6-8) – العرض الوظيفي والتعاقد | لائحة الهيئة السعودية للمياه", "swa_text": "تبلغ الهيئة المرشح بالعرض الوظيفي بخطاب رسمي يسلم مناولة أو عبر بريده الإلكتروني، على أن function personalContext(q, k) {
  // Detect personal situation from message
  const nq = norm(q);
  const years = q.match(/(\d+)\s*(سنة|سنوات|عام|أعوام)/);
  const salary = q.match(/(\d[\d,]*)\s*(ريال|ر\.س)/);
  const isFemale = /موظفة|أنثى|المرأة|زوجتي|والدتي/.test(q);
  const isMale = /موظف|أنا رجل|موظف سعودي/.test(q);
  const isFirstPerson = /أنا|انا|وضعي|حالتي|عندي|لدي|أعمل|اعمل/.test(q);
  const isResign = /استقال|استقالة|استقل/.test(nq);
  const isTerminated = /فصل|أُنهيت|انهاء خدمتي/.test(nq);

  if (!isFirstPerson && !years && !salary) return '';

  let lines = [];
  if (years) lines.push(`• سنوات الخدمة: <b>${years[1]} ${years[2]}</b>`);
  if (salary) {
    const sal = parseInt(salary[1].replace(/,/g,''));
    lines.push(`• الراتب الشهري: <b>${sal.toLocaleString()} ريال</b>`);
  }
  if (isFemale) lines.push(`• الجنس: <b>موظفة</b>`);
  else if (isMale) lines.push(`• الجنس: <b>موظف</b>`);
  if (isResign) lines.push(`• سبب الإنهاء: <b>استقالة</b>`);

  if (!lines.length) return '';

  return `<div class="context-box">
    <div class="context-title">📋 وضعك الوظيفي — استُخلص من سؤالك</div>

}

function getReply(q){

    return {tag:sourceTag(k), html: extra + answerCard(k,sc<38) + dualRef(k) + generalOptions(k)};

    let k2=KB.find(x=>x.id===hits[0].kb)||k;

}

      ${inputRow("تاريخ المباشرة", `<input type="date" id="d_joiningDate" value="${existing?.joiningDate||''}">`)}
      ${inputRow("تاريخ الاستقالة (إن وجد)", `<input type="date" id="d_resignationDate" value="${existing?.resignationDate||''}">`)}
      ${inputRow("رقم الإقامة", `<input type="text" id="d_iqamaNo" value="${esc(existing?.iqamaNo||'')}">`)}
      ${inputRow("تاريخ انتهاء الإقامة", `<input type="date" id="d_iqamaExpiry" value="${existing?.iqamaExpiry||''}">`)}
      ${inputRow("رفع صورة/PDF الإقامة", `<input type="file" id="d_iqamaFile" accept=".pdf,image/*">${fileStatus(existing?.iqamaFileUrl,'ملف إقامة')}`, true)}
      ${inputRow("رقم الجواز", `<input type="text" id="d_passportNo" value="${esc(existing?.passportNo||'')}">`)}
      ${inputRow("تاريخ انتهاء الجواز", `<input type="date" id="d_passportExpiry" value="${existing?.passportExpiry||''}">`)}
      ${inputRow("رفع صورة/PDF الجواز", `<input type="file" id="d_passportFile" accept=".pdf,image/*">${fileStatus(existing?.passportFileUrl,'ملف جواز')}`, true)}
      ${inputRow("تاريخ انتهاء بطاقة العمل", `<input type="date" id="d_workCardExpiry" value="${existing?.workCardExpiry||''}">`)}
      ${inputRow("رفع صورة/PDF بطاقة العمل", `<input type="file" id="d_workCardFile" accept=".pdf,image/*">${fileStatus(existing?.workCardFileUrl,'ملف بطاقة عمل')}`, true)}
      ${inputRow("ملاحظات", `<input type="text" id="d_notes" value="${esc(existing?.notes||'')}">`, true)}
    </div>
    <div id="docUploadMsg" style="font-size:12px;color:var(--muted);margin-top:10px;min-height:16px;"></div>`;
  openModal(isEdit ? "تعديل سجل وثائق" : "إضافة سجل وثائق", body, async ()=>{
    const name = document.getElementById('d_name').value.trim();
    if(!name) return;
    const msg = document.getElementById('docUploadMsg');
    const saveBtn = document.getElementById('modalSave');
    const record = {
      employeeId: document.getElementById('d_employeeId').value,
      name,
      nameEn: document.getElementById('d_nameEn').value,
      jobTitle: document.getElementById('d_jobTitle').value,
      grade: document.getElementById('d_grade').value,
      team: document.getElementById('d_team').value,
      nationality: document.getElementById('d_nationality').value,
      city: document.getElementById('d_city').value,
      birthDate: document.getElementById('d_birthDate').value,
      birthPlace: document.getElementById('d_birthPlace').value,
      joiningDate: document.getElementById('d_joiningDate').value,
      resignationDate: document.getElementById('d_resignationDate').value,
      iqamaNo: document.getElementById('d_iqamaNo').value,
      iqamaExpiry: document.getElementById('d_iqamaExpiry').value,
      passportNo: document.getElementById('d_passportNo').value,
      passportExpiry: document.getElementById('d_passportExpiry').value,
      workCardExpiry: document.getElementById('d_workCardExpiry').value,
      notes: document.getElementById('d_notes').value,
      iqamaFileUrl: existing?.iqamaFileUrl || null,
      passportFileUrl: existing?.passportFileUrl || null,
      workCardFileUrl: existing?.workCardFileUrl || null,
    };

    const uploads = [
      { input: document.getElementById('d_iqamaFile'), key: 'iqamaFileUrl', label: 'الإقامة' },
      { input: document.getElementById('d_passportFile'), key: 'passportFileUrl', label: 'الجواز' },
      { input: document.getElementById('d_workCardFile'), key: 'workCardFileUrl', label: 'بطاقة العمل' },
    ].filter(u => u.input && u.input.files && u.input.files[0]);

    if(uploads.length){
      saveBtn.disabled = true;
      for(const u of uploads){
        msg.textContent = `جارٍ رفع ملف ${u.label}...`;
        try{
          const fileName = `${name} — ${u.label}`;
          const uploaded = await driveUploadFile(u.input.files[0], fileName);
          record[u.key] = uploaded.url;
        } catch(e){
          msg.textContent = `تعذّر رفع ملف ${u.label} — تأكّد من اتصالك وحاول مرة أخرى`;
          saveBtn.disabled = false;
          return;
        }
      }
    }

    if(isEdit){
      const d = state.documents.find(x=>x.id===existing.id);
      if(d) Object.assign(d, record);
    } else {
      state.documents.push({ id: nextId('d'), ...record });
    }
    closeModal(); render(); saveDataToDrive();
  });
}

function inputRow(label, inner, full){
  return `<div class="field ${full?'full':''}"><label>${label}</label>${inner}</div>`;
}
function statusOptions(map, selected){
  return Object.entries(map).map(([k,v])=>`<option value="${k}" ${k===selected?'selected':''}>${v.label}</option>`).join("");
}
async function openRestoreModal(){
  openModal("استرجاع نسخة سابقة", `<div id="restoreListHost" style="max-height:360px;overflow-y:auto;font-size:13px;color:var(--muted);">جارٍ التحميل...</div>`, closeModal);
  try{

      host.innerHTML = `<div>لا توجد نسخ احتياطية تلقائية بعد — أول نسخة تُنشأ تلقائيًا مع أول حفظ من الآن فصاعدًا.</div>`;
      return;
    }
    host.innerHTML = backups.map(b=>{

async function restoreFromBackup(fileId){
  if(!confirm("سيتم استبدال كل البيانات الحالية بهذي النسخة الاحتياطية. سنأخذ نسخة من وضعك الحالي أولاً للأمان. هل تريد المتابعة؟")) return;
  try{
    const currentPayload = JSON.stringify({ teams: state.teams, tasks: state.tasks, corr: state.corr, facilities: state.facilities, documents: state.documents, idCounter, expertsImported: state.expertsImported, passportScansApplied: state.passportScansApplied, iqamaScansApplied: state.iqamaScansApplied, sultanAdded: state.sultanAdded, abdallatifAdded: state.abdallatifAdded, iqamaScansApplied2: state.iqamaScansApplied2, mubashirAdded: state.mubashirAdded, mustakeemAdded: state.mustakeemAdded, passportScansApplied3: state.passportScansApplied3, passportScansApplied4: state.passportScansApplied4, passportScansApplied5: state.passportScansApplied5, amrAdded: state.amrAdded, imranAdded: state.imranAdded, joiningDatesApplied: state.joiningDatesApplied, hrBatch2Applied: state.hrBatch2Applied, chrisEastIdFixed: state.chrisEastIdFixed, friedrichAdded: state.friedrichAdded, nourBirthApplied: state.nourBirthApplied, nikolayAdded: state.nikolayAdded, masterListApplied: state.masterListApplied, conflictsResolved: state.conflictsResolved, gradesApplied: state.gradesApplied, knowledgeDocs: state.knowledgeDocs, chatMessages: state.chatMessages.slice(-60), hrMemory: state.hrMemory });
    await saveAutoBackupToDrive(currentPayload);

    const raw = await driveGetFileContent(fileId);
    const data = JSON.parse(raw);
    state.teams = data.teams || state.teams;
    state.tasks = data.tasks || [];
    state.corr = data.corr || [];
    state.facilities = data.facilities || [];
    state.documents = data.documents || [];
    idCounter = data.idCounter || idCounter;
    Object.assign(state, {
      expertsImported: !!data.expertsImported, passportScansApplied: !!data.passportScansApplied,
      iqamaScansApplied: !!data.iqamaScansApplied, sultanAdded: !!data.sultanAdded, abdallatifAdded: !!data.abdallatifAdded,
      iqamaScansApplied2: !!data.iqamaScansApplied2, mubashirAdded: !!data.mubashirAdded, mustakeemAdded: !!data.mustakeemAdded,
      passportScansApplied3: !!data.passportScansApplied3, passportScansApplied4: !!data.passportScansApplied4, passportScansApplied5: !!data.passportScansApplied5,
      amrAdded: !!data.amrAdded, imranAdded: !!data.imranAdded, joiningDatesApplied: !!data.joiningDatesApplied, hrBatch2Applied: !!data.hrBatch2Applied,
      chrisEastIdFixed: !!data.chrisEastIdFixed, friedrichAdded: !!data.friedrichAdded, nourBirthApplied: !!data.nourBirthApplied,
      nikolayAdded: !!data.nikolayAdded, masterListApplied: !!data.masterListApplied, conflictsResolved: !!data.conflictsResolved, gradesApplied: !!data.gradesApplied,
      knowledgeDocs: data.knowledgeDocs || [], chatMessages: data.chatMessages || [], hrMemory: data.hrMemory || {},
    });
    closeModal();
    render();
    await saveDataToDrive();
    alert("تم استرجاع النسخة الاحتياطية بنجاح.");
  } catch(e){
    alert("تعذّر الاسترجاع: " + e.message);
  }
}

function buildReportHTML(){
  const scopeLabel = state.activeTeam === 'all' ? 'كل الإدارات' : teamName(state.activeTeam);
  const tasks = state.tasks.filter(t => state.activeTeam==='all' || t.team===state.activeTeam);
  const corr = state.corr.filter(c => state.activeTeam==='all' || c.team===state.activeTeam);

  const taskStats = {
    total: tasks.length,
    done: tasks.filter(t=>t.status==='done').length,
    progress: tasks.filter(t=>t.status==='progress').length,
    paused: tasks.filter(t=>t.status==='paused').length,
    overdue: tasks.filter(isOverdue).length,
  };
  const corrStats = {
    total: corr.length,
    incoming: corr.filter(c=>c.dir==='وارد').length,
    outgoing: corr.filter(c=>c.dir==='صادر').length,
    linked: corr.filter(c=>c.linkedTaskId).length,
    unlinked: corr.filter(c=>!c.linkedTaskId).length,
  };

  const rptStat = (label, val, color) => `
    <div class="rpt-stat"><div style="font-size:10px;color:var(--muted);">${label}</div>
    <div class="rpt-disp" style="font-size:18px;font-weight:800;color:${color};">${val}</div></div>`;

  const badge = (map, key) => {
    const s = map[key]; if(!s) return '—';
    return `<span class="rpt-badge" style="background:${s.color}1A;color:${s.color};">${s.label}</span>`;
  };

  const taskRows = tasks.map(t=>`
    <tr>
      <td style="font-weight:700;color:var(--navy2);white-space:nowrap;">${t.key}</td>
      <td>${esc(t.task)}</td>
      <td style="white-space:nowrap;">${esc(teamName(t.team))}</td>
      <td style="white-space:nowrap;">R:${esc(t.R)} / A:${esc(t.A)}</td>
      <td>${badge(STATUS, t.status)}</td>
      <td style="white-space:nowrap;">${t.dueDate||'—'}${isOverdue(t)?' <span style="color:var(--red);font-weight:700;">(متأخرة)</span>':''}</td>
    </tr>`).join("") || `<tr><td colspan="6" style="text-align:center;color:var(--muted);">لا توجد مهام ضمن هذا النطاق</td></tr>`;

  const corrRows = corr.map(c=>`
    <tr>
      <td style="white-space:nowrap;">${esc(c.transactionNo||'—')}</td>
      <td style="font-weight:700;color:var(--navy2);white-space:nowrap;">${c.key}</td>
      <td>${esc(c.name)}</td>
      <td style="white-space:nowrap;">${esc(teamName(c.team))}</td>
      <td style="white-space:nowrap;">${c.dir}</td>
      <td style="white-space:nowrap;">${c.date}</td>
      <td>${badge(STATUS, c.status)}</td>
    </tr>`).join("") || `<tr><td colspan="7" style="text-align:center;color:var(--muted);">لا توجد معاملات ضمن هذا النطاق</td></tr>`;

  const now = new Date();
  const genDate = now.toLocaleDateString('ar-SA', { year:'numeric', month:'long', day:'numeric' });
  const genTime = now.toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' });

  return `
    <div class="rpt-wrap">
      <div class="rpt-header">
        <div class="rpt-disp" style="font-size:19px;font-weight:800;">معهد وتيرا — الإدارة التنفيذية</div>
        <div style="font-size:12.5px;color:#B9C2D0;margin-top:4px;">تقرير مهام RACI والتراسل</div>
        <div style="font-size:11px;color:#B9C2D0;margin-top:8px;">نطاق التقرير: ${esc(scopeLabel)} · تاريخ الإنشاء: ${genDate} — ${genTime}</div>
      </div>

      <div class="rpt-section-title">مؤشرات مهام RACI</div>
      <div class="rpt-stats">
        ${rptStat("إجمالي المهام", taskStats.total, "var(--navy2)")}
        ${rptStat("منجزة", taskStats.done, "var(--green)")}
        ${rptStat("تحت الإجراء", taskStats.progress, "var(--teal)")}
        ${rptStat("معلقة", taskStats.paused, "var(--muted)")}
        ${rptStat("متأخرة", taskStats.overdue, "var(--red)")}
      </div>
      <table>
        <thead><tr>${["المرجع","المهمة","الإدارة","الأدوار","الحالة","تاريخ التسليم"].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${taskRows}</tbody>
      </table>

      <div class="rpt-section-title">مؤشرات التراسل</div>
      <div class="rpt-stats">
        ${rptStat("إجمالي المعاملات", corrStats.total, "var(--navy2)")}
        ${rptStat("وارد", corrStats.incoming, "var(--blue)")}
        ${rptStat("صادر", corrStats.outgoing, "var(--teal)")}
        ${rptStat("مرتبطة بمهمة", corrStats.linked, "var(--green)")}
        ${rptStat("بدون ربط", corrStats.unlinked, "var(--amber)")}
      </div>
      <table>
        <thead><tr>${["رقم المعاملة","المرجع","اسم المعاملة","الإدارة","صادر/وارد","التاريخ","الحالة"].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${corrRows}</tbody>

      <div class="rpt-footer">تم إنشاء هذا التقرير تلقائيًا من لوحة متابعة معهد وتيرا — ${genDate}</div>
    </div>`;

    </div>`;

          ${autoDownloadWorked
            ? 'إذا نزل الملف تلقائيًا لجهازك، خلاص انتهيت. وإذا ما نزل (شائع داخل بيئة المحادثة)، انسخ المحتوى بالأسفل والصقه بملف نصي جديد واحفظه بامتداد <b>.json</b>.'
            : 'التنزيل التلقائي ما اشتغل. انسخ المحتوى بالأسفل بالكامل، افتح محرر نصوص (Notepad مثلاً)، الصقه، واحفظ الملف بامتداد <b>.json</b>.'}
        </div>
        <textarea id="backupText" readonly style="width:100%;height:220px;font-family:monospace;font-size:11.5px;padding:10px;border-radius:8px;border:1px solid var(--line);resize:vertical;direction:ltr;text-align:left;">${esc(text)}</textarea>
        <div id="copyMsg" style="font-size:12px;color:var(--green);margin-top:6px;min-height:16px;"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">
          <button id="modalCancel" style="padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;">إغلاق</button>
          <button id="copyBackupBtn" style="display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;border:none;background:var(--navy);color:#fff;font-size:13px;font-weight:600;cursor:pointer;">${icon('download',14)} نسخ الكل</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); });
  document.getElementById('modalBox').addEventListener('click', (e)=>e.stopPropagation());
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  const textarea = document.getElementById('backupText');
  document.getElementById('copyBackupBtn').addEventListener('click', ()=>{
    textarea.focus(); textarea.select();
    let copied = false;
    try{ copied = document.execCommand('copy'); }catch(e){ copied = false; }
    if(!copied && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>{
        document.getElementById('copyMsg').textContent = "تم النسخ ✓ — الصقه بملف نصي واحفظه بامتداد .json";
      });
    } else {
      document.getElementById('copyMsg').textContent = copied ? "تم النسخ ✓ — الصقه بملف نصي واحفظه بامتداد .json" : "تعذّر النسخ التلقائي — حدد النص يدويًا وانسخه (Ctrl+C)";
    }
  });
}

function openTaskForm(existing){
  const isEdit = !!existing;
  const labs = state.facilities.filter(f=>f.kind==='مختبر');
  const stations = state.facilities.filter(f=>f.kind==='محطة تجريبية');
  const selectedFacility = existing?.linkedFacilityId || "";
  const facilityOptionsHtml = () => `
    <option value="">بدون ربط</option>
    ${labs.length ? `<optgroup label="المختبرات">${labs.map(fa=>`<option value="${fa.id}" ${fa.id===selectedFacility?'selected':''}>${fa.key} — ${esc(fa.name)}</option>`).join("")}</optgroup>` : ''}
    ${stations.length ? `<optgroup label="المحطات التجريبية">${stations.map(fa=>`<option value="${fa.id}" ${fa.id===selectedFacility?'selected':''}>${fa.key} — ${esc(fa.name)}</option>`).join("")}</optgroup>` : ''}
  `;
  const initialTeam = existing?.team || state.teams[0].id;
  const body = `
    <div class="fgrid">
      ${inputRow("رقم المرجع (اختياري)", `<input type="text" id="f_key" placeholder="يُولَّد تلقائيًا" value="${esc(existing?.key||'')}" ${isEdit?'disabled':''}>`)}
      ${inputRow("الفريق", `<select id="f_team">${teamOptions(initialTeam)}</select>`)}
      ${inputRow("مختبر / محطة مرتبطة (اختياري)", `<select id="f_facility">${facilityOptionsHtml()}</select>`, true)}
      ${inputRow("وصف المهمة", `<input type="text" id="f_task" value="${esc(existing?.task||'')}">`, true)}
      ${inputRow("نوع المهمة", `<input type="text" id="f_type" value="${esc(existing?.type||'بحثية')}">`)}
      ${inputRow("الحالة", `<select id="f_status">${statusOptions(STATUS, existing?.status || 'progress')}</select>`)}
      ${inputRow("المنفذ (R)", `<input type="text" id="f_R" value="${esc(existing?.R||'')}">`)}
      ${inputRow("المسؤول (A)", `<input type="text" id="f_A" value="${esc(existing?.A||'')}">`)}
      ${inputRow("المستشار (C)", `<input type="text" id="f_C" value="${esc(existing?.C||'')}">`)}
      ${inputRow("الإشعار (I)", `<input type="text" id="f_I" value="${esc(existing?.I||'')}">`)}
      ${inputRow("تاريخ التسليم", `<input type="date" id="f_due" value="${existing?.dueDate || todayISO()}">`)}
      ${isEdit ? inputRow("ملاحظات", `<input type="text" id="f_notes" value="${esc(existing?.notes||'')}">`, true) : ''}
    </div>`;
  openModal(isEdit ? "تعديل مهمة RACI" : "إضافة مهمة RACI", body, ()=>{
    const task = document.getElementById('f_task').value.trim();
    if(!task) return;
    const team = document.getElementById('f_team').value;
    const facilityId = document.getElementById('f_facility').value || null;

    if(isEdit){
      const t = state.tasks.find(x=>x.id===existing.id);
      if(t){
        t.team = team; t.task = task;
        t.type = document.getElementById('f_type').value;
        t.R = document.getElementById('f_R').value;
        t.A = document.getElementById('f_A').value;
        t.C = document.getElementById('f_C').value;
        t.I = document.getElementById('f_I').value;
        t.status = document.getElementById('f_status').value;
        t.dueDate = document.getElementById('f_due').value;
        t.notes = document.getElementById('f_notes').value;
        t.linkedFacilityId = facilityId;
      }
      closeModal(); render(); saveDataToDrive();
      return;
    }

    const id = nextId('r');
    const key = document.getElementById('f_key').value.trim() || `K-${idCounter}`;
    state.tasks.push({
      id, key, team, task,
      type: document.getElementById('f_type').value, R: document.getElementById('f_R').value,
      A: document.getElementById('f_A').value, C: document.getElementById('f_C').value, I: document.getElementById('f_I').value,
      status: document.getElementById('f_status').value, dueDate: document.getElementById('f_due').value, notes:"",
      linkedCorrId:null, linkedFacilityId: facilityId,
    });
    closeModal(); render(); saveDataToDrive();
  });
}

function openCorrForm(existing){

  const body = `

      ${inputRow("رقم المعاملة", `<input type="text" id="c_txn" placeholder="مثال: 2026/1450" value="${esc(existing?.transactionNo||'')}">`)}
      ${inputRow("رقم المرجع (اختياري)", `<input type="text" id="c_key" placeholder="يُولَّد تلقائيًا" value="${esc(existing?.key||'')}" ${isEdit?'disabled':''}>`)}
      ${inputRow("الفريق", `<select id="c_team">${teamOptions(existing?.team || state.teams[0].id)}</select>`)}
      ${inputRow("اسم المعاملة", `<input type="text" id="c_name" value="${esc(existing?.name||'')}">`, true)}
      ${inputRow("داخلي / خارجي", `<select id="c_scope"><option ${existing?.scope==='داخلي'?'selected':''}>داخلي</option><option ${existing?.scope==='خارجي'?'selected':''}>خارجي</option></select>`)}
      ${inputRow("صادر / وارد", `<select id="c_dir"><option ${existing?.dir==='وارد'?'selected':''}>وارد</option><option ${existing?.dir==='صادر'?'selected':''}>صادر</option></select>`)}
      ${inputRow("المحالة إليه", `<input type="text" id="c_ref" value="${esc(existing?.referredTo||'')}">`)}
      ${inputRow("تاريخ المعاملة", `<input type="date" id="c_date" value="${existing?.date || todayISO()}">`)}
      ${isEdit ? inputRow("الحالة", `<select id="c_status">${statusOptions(STATUS, existing?.status || 'progress')}</select>`) : ''}
    </div>
    ${isEdit ? '' : `<label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;cursor:pointer;">
      <input type="checkbox" id="c_createTask" checked> إنشاء مهمة RACI مرتبطة تلقائيًا لمتابعة هذه المعاملة
    </label>`}`;
  openModal(isEdit ? "تعديل معاملة تراسل" : "إضافة معاملة تراسل", body, ()=>{
