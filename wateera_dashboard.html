/* ---------------- helpers ---------------- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysFrom(dateStr){ return Math.floor((new Date() - new Date(dateStr)) / 86400000); }
function isOverdue(item){ return item.status !== "done" && item.dueDate && daysFrom(item.dueDate) > 3; }
function docDateStatus(dateStr){
  if(!dateStr) return 'none';
  const d = daysFrom(dateStr); // موجب = أيام مضت منذ الانتهاء (منتهية)، سالب = أيام متبقية حتى الانتهاء
  if(d > 0) return 'expired';
  if(-d <= 30) return 'soon';
  return 'ok';
}
function worstDocStatus(...statuses){
  const order = { expired:3, soon:2, ok:1, none:0 };
  return statuses.reduce((worst, s) => order[s] > order[worst] ? s : worst, 'none');
}

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function linkedCorrFor(task){ return state.corr.find(c=>c.id===task.linkedCorrId); }

function facilityFor(task){ return state.facilities.find(f=>f.id===task.linkedFacilityId); }

/* ---------------- Google Sign-In + Drive persistence ---------------- */
function waitForGIS(cb){
  if(window.google && window.google.accounts && window.google.accounts.oauth2){ cb(); }
  else setTimeout(()=>waitForGIS(cb), 100);
}

function initGoogleAuth(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async (resp) => {
      if(resp.error){
        state.saveStatus = "تعذّر تسجيل الدخول: " + resp.error;
        render();
        return;
      }
      driveAccessToken = resp.access_token;
      state.unlocked = true;
      state.saveStatus = "جارٍ تحميل البيانات من Google Drive...";
      render();
      await loadDataFromDrive();
    },
  });
}

function signIn(){
  if(!tokenClient) return;
  tokenClient.requestAccessToken();
}

function signOut(){
  if(driveAccessToken && window.google){
    google.accounts.oauth2.revoke(driveAccessToken, ()=>{});
  }
  driveAccessToken = null;
  driveFileId = null;
  state.unlocked = false;
  state.ready = false;
  render();
}

async function driveFindFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
    headers: { Authorization: `Bearer ${driveAccessToken}` }
  });
  if(!res.ok) throw new Error("drive_list_failed");
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function driveGetFileContent(fileId){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { Authorization: `Bearer ${driveAccessToken}` }
  });
  if(!res.ok) throw new Error("drive_get_failed");
  return await res.text();
}

async function driveCreateFile(content){
  const metadata = { name: DRIVE_FILE_NAME, mimeType: "application/json" };
  const boundary = "-------wateeraBoundary";
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
    method: "POST",
    headers: { Authorization: `Bearer ${driveAccessToken}`, "Content-Type": `multipart/related; boundary=${boundary}` },
    body,
  });
  if(!res.ok) throw new Error("drive_create_failed");
  const data = await res.json();
  return data.id;
}

async function driveUpdateFile(fileId, content){
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: "PATCH",
    headers: { Authorization: `Bearer ${driveAccessToken}`, "Content-Type": "application/json" },
    body: content,
  });
  if(!res.ok) throw new Error("drive_update_failed");
}

async function driveUploadFile(file, customName){
  const metadata = { name: customName || file.name, mimeType: file.type || "application/octet-stream" };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", file);
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink", {
    method: "POST",
    headers: { Authorization: `Bearer ${driveAccessToken}` },
    body: form,
  });
  if(!res.ok) throw new Error("drive_upload_failed");
  const data = await res.json();
  return { id: data.id, url: data.webViewLink };
}

async function loadDataFromDrive(){
  try{
    driveFileId = await driveFindFile();
    if(driveFileId){
      const raw = await driveGetFileContent(driveFileId);
      const data = JSON.parse(raw);
      state.teams = data.teams; state.tasks = data.tasks; state.corr = data.corr; state.facilities = data.facilities;
      state.documents = data.documents || [];
      idCounter = data.idCounter || 100;
      state.trialCleared = !!data.trialCleared;
      state.expertsImported = !!data.expertsImported;
      state.passportScansApplied = !!data.passportScansApplied;
      state.iqamaScansApplied = !!data.iqamaScansApplied;
      state.sultanAdded = !!data.sultanAdded;
      state.abdallatifAdded = !!data.abdallatifAdded;
      state.iqamaScansApplied2 = !!data.iqamaScansApplied2;
      state.mubashirAdded = !!data.mubashirAdded;
      state.mustakeemAdded = !!data.mustakeemAdded;
      state.saveStatus = "تم تحميل البيانات من Google Drive";
    } else {
      const seed = getSeedData();
      state.teams = seed.teams; state.tasks = seed.tasks; state.corr = seed.corr; state.facilities = seed.facilities;
      state.documents = seed.documents;
      idCounter = seed.idCounter;
      state.saveStatus = "لا يوجد ملف سابق — جارٍ إنشاء أول نسخة بـ Drive...";
    }
  } catch(e){
    const seed = getSeedData();
    state.teams = seed.teams; state.tasks = seed.tasks; state.corr = seed.corr; state.facilities = seed.facilities;
    state.documents = seed.documents;
    idCounter = seed.idCounter;
    state.saveStatus = "تعذّر الاتصال بـ Drive: " + e.message;
  }
  let needsSave = ensureBaselineTeams();
  needsSave = ensureBaselineFacilities() || needsSave;
  if(!state.trialCleared){
    clearTrialData();
    state.trialCleared = true;
    needsSave = true;
  }
  if(!state.expertsImported){
    ensureBaselineExperts();
    state.expertsImported = true;
    needsSave = true;
  }
  if(!state.passportScansApplied){
    applyPassportScanUpdates();
    state.passportScansApplied = true;
    needsSave = true;
  }
  if(!state.iqamaScansApplied){
    applyIqamaScanUpdates();
    state.iqamaScansApplied = true;
    needsSave = true;
  }
  if(!state.sultanAdded){
    ensureSultanAhmed();
    state.sultanAdded = true;
    needsSave = true;
  }
  if(!state.abdallatifAdded){
    ensureAbdallatif();
    state.abdallatifAdded = true;
    needsSave = true;
  }
  if(!state.iqamaScansApplied2){
    applyIqamaScanUpdates2();
    state.iqamaScansApplied2 = true;
    needsSave = true;
  }
  if(!state.mubashirAdded){
    ensureMubashir();
    state.mubashirAdded = true;
    needsSave = true;
  }
  if(!state.mustakeemAdded){
    ensureMustakeem();
    state.mustakeemAdded = true;
    needsSave = true;
  }
  if(needsSave) await saveDataToDrive();
  state.ready = true;
  render();
}

async function saveDataToDrive(){

    if(!driveFileId){
      driveFileId = await driveCreateFile(payload);
    } else {
      await driveUpdateFile(driveFileId, payload);
    }
    const t = new Date().toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' });
    state.saveStatus = "آخر حفظ في Google Drive: " + t;
    updateSaveIndicator(state.saveStatus, "#B9C2D0");
  } catch(e){
    state.saveStatus = "تعذّر الحفظ في Drive — " + e.message;
    updateSaveIndicator(state.saveStatus, "#F2A6A0");
  }
}

function computeStats(pool){
  return {
    total: pool.length,
    done: pool.filter(t=>t.status==='done').length,
    progress: pool.filter(t=>t.status==='progress').length,
    paused: pool.filter(t=>t.status==='paused').length,
    overdue: pool.filter(isOverdue).length,
  };
}

function renderDashboard(){
  const pool = state.activeTeam==='all' ? state.tasks : state.tasks.filter(t=>t.team===state.activeTeam);
  const stats = computeStats(pool);
  const teamStats = state.teams.map(tm=>{
    const p = state.tasks.filter(t=>t.team===tm.id);
    const done = p.filter(t=>t.status==='done').length;
    return {...tm, total:p.length, done, pct: p.length ? Math.round(done/p.length*100) : 0, overdue: p.filter(isOverdue).length};
  });
  const overdueTasks = state.tasks.filter(t => (state.activeTeam==='all'||t.team===state.activeTeam) && isOverdue(t));

  const corrPool = state.activeTeam==='all' ? state.corr : state.corr.filter(c=>c.team===state.activeTeam);
  const corrStats = {
    total: corrPool.length,
    incoming: corrPool.filter(c=>c.dir==='وارد').length,
    outgoing: corrPool.filter(c=>c.dir==='صادر').length,
    done: corrPool.filter(c=>c.status==='done').length,
    progress: corrPool.filter(c=>c.status==='progress').length,
    paused: corrPool.filter(c=>c.status==='paused').length,
    linked: corrPool.filter(c=>c.linkedTaskId).length,
    unlinked: corrPool.filter(c=>!c.linkedTaskId).length,
  };

  const facPool = state.activeTeam==='all' ? state.facilities : state.facilities.filter(f=>f.team===state.activeTeam);
  const facStats = {
    labs: facPool.filter(f=>f.kind==='مختبر').length,
    stations: facPool.filter(f=>f.kind==='محطة تجريبية').length,
    active: facPool.filter(f=>f.status==='active').length,
    maintenance: facPool.filter(f=>f.status==='maintenance').length,

  const statCard = (label,val,color,ic) => `
    <div class="statcard">

        <span style="font-size:12.5px;color:var(--muted);font-weight:600;">${label}</span>${icon(ic,16,color)}
      </div>
      <div class="disp" style="font-size:28px;font-weight:800;color:${color};margin-top:6px;">${val}</div>
    </div>`;

  return `
  <div style="display:flex;flex-direction:column;gap:20px;">
    <div>
      <div class="disp" style="font-weight:700;font-size:15px;margin-bottom:10px;">مؤشرات مهام RACI</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;">
        ${statCard("إجمالي المهام", stats.total, "var(--navy2)", "tasks")}
        ${statCard("منجزة", stats.done, "var(--green)", "check")}
        ${statCard("تحت الإجراء", stats.progress, "var(--teal)", "clock")}
        ${statCard("معلقة", stats.paused, "var(--muted)", "pause")}
        ${statCard("متأخرة +٣ أيام", stats.overdue, "var(--red)", "alert")}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;">
      <div class="card" style="padding:18px;">
        <div class="disp" style="font-weight:700;font-size:15px;margin-bottom:14px;">إنجاز الإدارات</div>
        <div style="display:flex;flex-direction:column;gap:14px;">
          ${teamStats.map((tm,i)=>`
            <div>
              <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
                <span style="font-weight:600;display:flex;align-items:center;gap:6px;">
                  <span style="width:8px;height:8px;border-radius:99px;background:${TEAM_COLORS[i % TEAM_COLORS.length]}"></span>${esc(tm.name)}
                </span>
                <span style="color:var(--muted);">${tm.done}/${tm.total} · ${tm.pct}%${tm.overdue>0?` <span style="color:var(--red);margin-right:8px;">● ${tm.overdue} متأخرة</span>`:''}</span>
              </div>
              <div style="height:8px;background:#EEF0EC;border-radius:99px;overflow:hidden;">
                <div style="width:${tm.pct}%;height:100%;background:${TEAM_COLORS[i % TEAM_COLORS.length]};border-radius:99px;"></div>
              </div>
            </div>`).join("")}
        </div>
      </div>
      <div class="card" style="padding:18px;">
        <div class="disp" style="font-weight:700;font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:6px;">${icon('alert',16,'var(--red)')} بحاجة متابعة عاجلة</div>
        ${overdueTasks.length===0 ? `<div style="font-size:13px;color:var(--muted);padding:10px 0;">لا توجد مهام متأخرة حاليًا 🎉</div>` :
          `<div style="display:flex;flex-direction:column;gap:10px;">
            ${overdueTasks.map(t=>`
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px;border-bottom:1px dashed var(--line);padding-bottom:8px;">
                <div><div style="font-weight:600;">${esc(t.task)}</div><div style="color:var(--muted);margin-top:2px;">${esc(teamName(t.team))} · متأخرة ${daysFrom(t.dueDate)} يوم</div></div>
                <span style="background:#FCEBEA;color:var(--red);font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;">${t.key}</span>
              </div>`).join("")}
          </div>`}
      </div>
    </div>
    <div>
      <div class="disp" style="font-weight:700;font-size:15px;margin-bottom:10px;">مؤشرات التراسل</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;">
        ${statCard("إجمالي المعاملات", corrStats.total, "var(--navy2)", "send")}
        ${statCard("وارد", corrStats.incoming, "var(--blue)", "send")}
        ${statCard("صادر", corrStats.outgoing, "var(--teal)", "send")}
        ${statCard("منجزة", corrStats.done, "var(--green)", "check")}
        ${statCard("تحت الإجراء", corrStats.progress, "var(--teal)", "clock")}
        ${statCard("معلقة", corrStats.paused, "var(--muted)", "pause")}
      </div>
      <div class="card" style="padding:16px 18px;margin-top:12px;">
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">كل معاملة مرتبطة بمهمة RACI تُغلق آليًا معها — يمنع ضياع المتابعة بين الأنظمة</div>
        <div style="display:flex;gap:24px;flex-wrap:wrap;">
          <div class="disp" style="font-size:22px;font-weight:800;color:var(--teal);">${corrStats.linked}<span style="font-size:12px;color:var(--muted);font-weight:500;margin-right:6px;">معاملة مرتبطة بمهمة</span></div>
          <div class="disp" style="font-size:22px;font-weight:800;color:var(--amber);">${corrStats.unlinked}<span style="font-size:12px;color:var(--muted);font-weight:500;margin-right:6px;">بدون ربط بعد</span></div>
        </div>
      </div>
    </div>
    <div class="card" style="padding:18px;">
      <div class="disp" style="font-weight:700;font-size:15px;margin-bottom:14px;">المختبرات والمحطات التجريبية</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;">
        ${statCard("مختبرات", facStats.labs, "var(--teal)", "flask")}
        ${statCard("محطات تجريبية", facStats.stations, "var(--blue)", "radio")}
        ${statCard("قيد التشغيل", facStats.active, "var(--green)", "check")}
        ${statCard("تحت الصيانة", facStats.maintenance, "var(--amber)", "wrench")}
        ${statCard("متوقف", facStats.idle, "var(--muted)", "pause")}
      </div>
    </div>
  </div>`;
}

function toolbar(addLabel, addAction, secondary){
  return `

    <div style="position:relative;flex:1;min-width:200px;max-width:320px;">

      ${secondary ? `<button id="${secondary.action}" style="display:flex;align-items:center;gap:6px;background:#fff;color:var(--navy);border:1px solid var(--line);padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;">${icon('plus',15)} ${secondary.label}</button>` : ''}
      <button id="${addAction}" style="display:flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border:none;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;">${icon('plus',15)} ${addLabel}</button>

function renderRaci(){
  const tasks = state.tasks.filter(t => (state.activeTeam==='all'||t.team===state.activeTeam) && (t.task.includes(state.search)||t.key.includes(state.search)));
  const rows = tasks.map(t=>{
    const overdue = isOverdue(t);
    const lc = linkedCorrFor(t);
    const lf = facilityFor(t);
    return `<tr>
      <td style="font-weight:700;color:var(--navy2);">${t.key}</td>
      <td style="max-width:220px;"><div style="font-weight:600;">${esc(t.task)}</div><div style="color:var(--muted);font-size:11.5px;margin-top:2px;">${esc(t.type)}</div></td>
      <td><span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:7px;height:7px;border-radius:99px;background:${teamColor(t.team)}"></span>${esc(teamName(t.team))}</span></td>
      <td><div style="display:flex;flex-wrap:wrap;max-width:220px;">${roleChip('R',t.R,'#0E7C7B')}${roleChip('A',t.A,'#142033')}${roleChip('C',t.C,'#C98A2C')}${roleChip('I',t.I,'#8A93A3')}</div></td>
      <td>${statusBadge(STATUS,t.status)}</td>
      <td style="white-space:nowrap;">
        <span class="${overdue?'pulse':''}">${t.dueDate||'—'}</span>
        ${overdue?`<div style="color:var(--red);font-size:11px;font-weight:700;margin-top:2px;">متأخرة ${daysFrom(t.dueDate)} يوم</div>`:''}
      </td>
      <td>${lc?`<button class="linkbtn goto" data-tab="corr" style="color:var(--teal);">${icon('link',11)} ${lc.key}</button>`:`<span style="color:var(--muted);font-size:11.5px;">—</span>`}</td>
      <td>${lf?`<button class="linkbtn goto" data-tab="${lf.kind==='مختبر'?'labs':'stations'}" style="color:var(--blue);">${icon(lf.kind==='مختبر'?'flask':'radio',11)} ${lf.key}</button>`:`<span style="color:var(--muted);font-size:11.5px;">—</span>`}</td>

  return `

    <div class="card" style="overflow:hidden;">
      <div class="scroller" style="overflow-x:auto;">
        <table><thead><tr>${["المرجع","المهمة","الفريق","الأدوار (RACI)","الحالة","تاريخ التسليم","تراسل مرتبط","مرفق مرتبط",""].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>
  `;
}

function renderCorr(){
  const items = state.corr.filter(c => (state.activeTeam==='all'||c.team===state.activeTeam) && (c.name.includes(state.search)||c.key.includes(state.search)||(c.transactionNo||'').includes(state.search)));
  const rows = items.map(c=>{
    const lt = linkedTaskFor(c);
    return `<tr>
      <td style="font-weight:700;color:var(--navy2);white-space:nowrap;">${esc(c.transactionNo||'—')}</td>
      <td style="font-weight:700;color:var(--navy2);">${c.key}</td>
      <td style="font-weight:600;max-width:220px;">${esc(c.name)}</td>
      <td><span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:7px;height:7px;border-radius:99px;background:${teamColor(c.team)}"></span>${esc(teamName(c.team))}</span></td>
      <td style="color:var(--muted);">${c.scope}</td>
      <td><span style="font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:${c.dir==='صادر'?'#EAF3F1':'#F1EFFB'};color:${c.dir==='صادر'?'var(--teal)':'#6C4FC7'};">${c.dir}</span></td>

      <td>${statusBadge(STATUS,c.status)}</td>
      <td>${lt?`<button class="linkbtn goto" data-tab="raci" style="color:var(--teal);">${icon('link',11)} ${lt.key}</button>`:`<span style="color:var(--amber);font-size:11.5px;font-weight:600;">بدون ربط</span>`}</td>
      <td><button class="linkbtn editCorrBtn" data-id="${c.id}" style="color:var(--navy2);">${icon('edit',11)} تعديل</button></td>

  }).join("") || `<tr><td colspan="10" style="padding:30px;text-align:center;color:var(--muted);">لا توجد معاملات مطابقة</td></tr>`;

  return `
    ${toolbar("إضافة معاملة","addCorrBtn")}
    <div class="card" style="overflow:hidden;">
      <div class="scroller" style="overflow-x:auto;">
        <table><thead><tr>${["رقم المعاملة","المرجع","اسم المعاملة","الفريق","النوع","صادر/وارد","التاريخ","الحالة","مرتبطة بمهمة",""].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>
  `;
}

function renderFacilitiesByKind(kind, tabId, addLabel, titleLabel, iconName){
  const pool = state.facilities.filter(f=>f.kind===kind && (state.activeTeam==='all'||f.team===state.activeTeam));
  const fstats = {
    total: pool.length,
    active: pool.filter(f=>f.status==='active').length,
    maintenance: pool.filter(f=>f.status==='maintenance').length,
    idle: pool.filter(f=>f.status==='idle').length,
  };
  const statCard = (label,val,color,ic) => `
    <div class="statcard"><div style="display:flex;align-items:center;justify-content:space-between;"><span style="font-size:12.5px;color:var(--muted);font-weight:600;">${label}</span>${icon(ic,16,color)}</div>
    <div class="disp" style="font-size:28px;font-weight:800;color:${color};margin-top:6px;">${val}</div></div>`;

  const items = pool.filter(f => f.name.includes(state.search)||f.key.includes(state.search));
  const rows = items.map(f=>{
    const linked = tasksForFacility(f.id);
    const openCount = linked.filter(t=>t.status!=='done').length;
    return `<tr>
      <td style="font-weight:700;color:var(--navy2);">${f.key}</td>
      <td style="font-weight:600;max-width:220px;">${esc(f.name)}${f.notes?`<div style="color:var(--muted);font-size:11.5px;margin-top:2px;font-weight:400;">${esc(f.notes)}</div>`:''}</td>
      <td><span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:7px;height:7px;border-radius:99px;background:${teamColor(f.team)}"></span>${esc(teamName(f.team))}</span></td>
      <td style="color:var(--muted);"><span style="display:inline-flex;align-items:center;gap:4px;">${icon('pin',12)} ${esc(f.location)}</span></td>
      <td style="color:var(--muted);white-space:nowrap;">${esc(f.capacity)}</td>
      <td>${statusBadge(LAB_STATUS,f.status)}</td>
      <td>${linked.length===0?`<span style="color:var(--muted);font-size:11.5px;">—</span>`:`<button class="linkbtn goto" data-tab="raci" style="color:${openCount?'var(--amber)':'var(--green)'};">${icon('link',11)} ${linked.length} مهمة${openCount?` (${openCount} مفتوحة)`:''}</button>`}</td>
      <td><button class="linkbtn editFacilityBtn" data-id="${f.id}" style="color:var(--navy2);">${icon('edit',11)} تعديل</button></td>
    </tr>`;
  }).join("") || `<tr><td colspan="8" style="padding:30px;text-align:center;color:var(--muted);">لا توجد ${titleLabel} مطابقة</td></tr>`;

  return `
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;">
      ${statCard("إجمالي " + titleLabel, fstats.total, "var(--navy2)", iconName)}
      ${statCard("قيد التشغيل", fstats.active, "var(--green)", "check")}
      ${statCard("تحت الصيانة", fstats.maintenance, "var(--amber)", "wrench")}
      ${statCard("متوقف", fstats.idle, "var(--muted)", "pause")}
    </div>
    ${toolbar(addLabel, "addFacilityBtn_" + tabId, { label:"إضافة مهمة", action:"addTaskBtn" })}
    <div class="card" style="overflow:hidden;">
      <div class="scroller" style="overflow-x:auto;">
        <table><thead><tr>${["المرجع","الاسم","الفريق المسؤول","الموقع","السعة","الحالة","مهام مرتبطة",""].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>
  `;
}
function renderLabs(){ return renderFacilitiesByKind("مختبر", "labs", "إضافة مختبر", "مختبرات", "flask"); }
function renderStations(){ return renderFacilitiesByKind("محطة تجريبية", "stations", "إضافة محطة تجريبية", "محطات", "radio"); }

function renderTeams(){
  const cards = state.teams.map((tm,i)=>{
    const pool = state.tasks.filter(t=>t.team===tm.id);
    const done = pool.filter(t=>t.status==='done').length;
    const pct = pool.length ? Math.round(done/pool.length*100) : 0;
    const overdue = pool.filter(isOverdue).length;
    const fac = state.facilities.filter(f=>f.team===tm.id);
    const facActive = fac.filter(f=>f.status==='active').length;
    return `
    <div class="card" style="border-top:4px solid ${TEAM_COLORS[i % TEAM_COLORS.length]};padding:18px;">
      <div class="disp" style="font-weight:700;font-size:15px;margin-bottom:12px;">${esc(tm.name)}</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px;">
        <span style="color:var(--muted);">نسبة الإنجاز</span><span class="disp" style="font-weight:800;color:${TEAM_COLORS[i % TEAM_COLORS.length]};">${pct}%</span>
      </div>
      <div style="height:8px;background:#EEF0EC;border-radius:99px;overflow:hidden;margin-bottom:14px;">
        <div style="width:${pct}%;height:100%;background:${TEAM_COLORS[i % TEAM_COLORS.length]};"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:12px;">
        <span>إجمالي: ${pool.length}</span><span>منجزة: ${done}</span>
        <span style="color:${overdue?'var(--red)':'var(--muted)'};font-weight:${overdue?'700':'400'};">متأخرة: ${overdue}</span>
      </div>
      <div style="border-top:1px dashed var(--line);padding-top:10px;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);">
        ${icon('flask',13)} ${fac.length} مرفق (${facActive} قيد التشغيل)
      </div>
    </div>`;
  }).join("");
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;">${cards}</div>`;
}

function docStatCard(label,val,color,ic){
  return `<div class="statcard"><div style="display:flex;align-items:center;justify-content:space-between;"><span style="font-size:12.5px;color:var(--muted);font-weight:600;">${label}</span>${icon(ic,16,color)}</div>
  <div class="disp" style="font-size:28px;font-weight:800;color:${color};margin-top:6px;">${val}</div></div>`;
}

function docDateCell(dateStr, fileUrl){
  const st = docDateStatus(dateStr);
  const s = DOC_STATUS[st];
  const fileLink = fileUrl ? `<a href="${fileUrl}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:3px;color:var(--teal);font-size:10px;font-weight:600;margin-top:2px;">${icon('card',9)} عرض الملف</a>` : '';
  if(!dateStr) return `<span style="color:var(--muted);font-size:11.5px;">—</span>${fileLink?`<div>${fileLink}</div>`:''}`;
  const d = daysFrom(dateStr);
  const sub = d > 0 ? `منتهية منذ ${d} يوم` : `متبقي ${-d} يوم`;
  return `<div>${dateStr}<div style="font-size:10.5px;color:${s.color};font-weight:700;margin-top:1px;">${sub}</div>${fileLink}</div>`;
}

function renderDocuments(){
  const pool = state.documents.filter(d => state.activeTeam==='all' || d.team===state.activeTeam);
  const withStatus = pool.map(d => ({
    ...d,
    iqamaSt: docDateStatus(d.iqamaExpiry),
    passportSt: docDateStatus(d.passportExpiry),
    cardSt: docDateStatus(d.workCardExpiry),
  }));
  const stats = {
    total: pool.length,
    expired: withStatus.filter(d => worstDocStatus(d.iqamaSt,d.passportSt,d.cardSt)==='expired').length,
    soon: withStatus.filter(d => worstDocStatus(d.iqamaSt,d.passportSt,d.cardSt)==='soon').length,
    ok: withStatus.filter(d => worstDocStatus(d.iqamaSt,d.passportSt,d.cardSt)==='ok').length,
  };

  const items = withStatus.filter(d =>
    d.name.includes(state.search) || (d.employeeId||'').includes(state.search) ||
    (d.iqamaNo||'').includes(state.search) || (d.passportNo||'').includes(state.search)
  );

  const field = (label, value) => `
    <div>
      <div style="font-size:10px;color:var(--muted);font-weight:600;">${label}</div>
      <div style="font-size:12.5px;font-weight:600;margin-top:1px;">${value || '<span style="color:var(--muted);font-weight:400;">—</span>'}</div>
    </div>`;

  const cards = items.map(d=>{
    const worst = worstDocStatus(d.iqamaSt, d.passportSt, d.cardSt);
    const alertBadge = worst==='expired'
      ? `<span class="chip" style="background:#FCEBEA;color:var(--red);">${icon('alert',11)} يوجد وثائق منتهية</span>`
      : (worst==='soon' ? `<span class="chip" style="background:#FCF3E4;color:var(--amber);">${icon('alert',11)} قريبة الانتهاء</span>` : '');
    return `
    <div class="card" style="border-top:4px solid ${teamColor(d.team)};padding:16px 18px;font-size:12.5px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
        <div>
          <div class="disp" style="font-weight:800;font-size:15px;">${esc(d.name)}</div>
          ${d.nameEn?`<div style="color:var(--muted);font-size:11px;margin-top:1px;">${esc(d.nameEn)}</div>`:''}
          <div style="margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);"><span style="width:7px;height:7px;border-radius:99px;background:${teamColor(d.team)}"></span>${esc(teamName(d.team))}</span>
            ${d.jobTitle?`<span style="font-size:11.5px;color:var(--muted);">· ${esc(d.jobTitle)}</span>`:''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          ${alertBadge}
          <button class="linkbtn editDocumentBtn" data-id="${d.id}" style="color:var(--navy2);">${icon('edit',11)} تعديل</button>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;padding:10px 0;border-top:1px dashed var(--line);">
        ${field("معرف الموظف", esc(d.employeeId))}
        ${field("الجنسية", esc(d.nationality))}
        ${field("المدينة", esc(d.city))}
        ${field("تاريخ الميلاد", esc(d.birthDate))}
        ${field("مكان الميلاد", esc(d.birthPlace))}
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:10px 0;border-top:1px dashed var(--line);">
        ${field("رقم الإقامة", esc(d.iqamaNo))}
        <div><div style="font-size:10px;color:var(--muted);font-weight:600;">انتهاء الإقامة</div><div style="margin-top:1px;">${docDateCell(d.iqamaExpiry, d.iqamaFileUrl)}</div></div>
        ${field("رقم الجواز", esc(d.passportNo))}
        <div><div style="font-size:10px;color:var(--muted);font-weight:600;">انتهاء الجواز</div><div style="margin-top:1px;">${docDateCell(d.passportExpiry, d.passportFileUrl)}</div></div>
        <div></div>
        <div><div style="font-size:10px;color:var(--muted);font-weight:600;">انتهاء بطاقة العمل</div><div style="margin-top:1px;">${docDateCell(d.workCardExpiry, d.workCardFileUrl)}</div></div>
      </div>
      ${d.notes ? `<div style="border-top:1px dashed var(--line);padding-top:8px;margin-top:2px;font-size:11.5px;color:var(--muted);">${esc(d.notes)}</div>` : ''}
    </div>`;
  }).join("") || `<div class="card" style="padding:30px;text-align:center;color:var(--muted);">لا توجد سجلات مطابقة</div>`;

  return `
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;">
      ${docStatCard("إجمالي السجلات", stats.total, "var(--navy2)", "card")}
      ${docStatCard("منتهية", stats.expired, "var(--red)", "alert")}
      ${docStatCard("قريبة الانتهاء (٣٠ يوم)", stats.soon, "var(--amber)", "alert")}
      ${docStatCard("سارية", stats.ok, "var(--green)", "check")}
    </div>
    ${toolbar("إضافة سجل","addDocumentBtn")}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px;">
      ${cards}
    </div>`;
}

function openDocumentForm(existing){
  const isEdit = !!existing;
  const fileStatus = (url, label) => url ? `<div style="font-size:11px;color:var(--teal);margin-top:4px;">📎 يوجد ${label} مرفق — اختر ملفًا جديدًا لاستبداله</div>` : '';
  const body = `
    <div class="fgrid">
      ${inputRow("معرف الموظف", `<input type="text" id="d_employeeId" value="${esc(existing?.employeeId||'')}">`)}
      ${inputRow("الإدارة", `<select id="d_team">${teamOptions(existing?.team || state.teams[0].id)}</select>`)}
      ${inputRow("الاسم", `<input type="text" id="d_name" value="${esc(existing?.name||'')}">`, true)}
      ${inputRow("الاسم بالإنجليزي", `<input type="text" id="d_nameEn" value="${esc(existing?.nameEn||'')}">`, true)}
      ${inputRow("المسمى الوظيفي", `<input type="text" id="d_jobTitle" value="${esc(existing?.jobTitle||'')}">`)}
      ${inputRow("الجنسية", `<input type="text" id="d_nationality" value="${esc(existing?.nationality||'')}">`)}
      ${inputRow("المدينة", `<input type="text" id="d_city" value="${esc(existing?.city||'')}">`)}
      ${inputRow("تاريخ الميلاد", `<input type="date" id="d_birthDate" value="${existing?.birthDate||''}">`)}
      ${inputRow("مكان الميلاد", `<input type="text" id="d_birthPlace" value="${esc(existing?.birthPlace||'')}">`, true)}
      ${inputRow("رقم الإقامة", `<input type="text" id="d_iqamaNo" value="${esc(existing?.iqamaNo||'')}">`)}
      ${inputRow("تاريخ انتهاء الإقامة", `<input type="date" id="d_iqamaExpiry" value="${existing?.iqamaExpiry||''}">`)}
      ${inputRow("رفع صورة/PDF الإقامة", `<input type="file" id="d_iqamaFile" accept=".pdf,image/*">${fileStatus(existing?.iqamaFileUrl,'ملف إقامة')}`, true)}
      ${inputRow("رقم الجواز", `<input type="text" id="d_passportNo" value="${esc(existing?.passportNo||'')}">`)}
      ${inputRow("تاريخ انتهاء الجواز", `<input type="date" id="d_passportExpiry" value="${existing?.passportExpiry||''}">`)}
      ${inputRow("رفع صورة/PDF الجواز", `<input type="file" id="d_passportFile" accept=".pdf,image/*">${fileStatus(existing?.passportFileUrl,'ملف جواز')}`, true)}
      ${inputRow("تاريخ انتهاء بطاقة العمل", `<input type="date" id="d_workCardExpiry" value="${existing?.workCardExpiry||''}">`)}
      ${inputRow("رفع صورة/PDF بطاقة العمل", `<input type="file" id="d_workCardFile" accept=".pdf,image/*">${fileStatus(existing?.workCardFileUrl,'ملف بطاقة عمل')}`, true)}
      ${inputRow("ملاحظات", `<input type="text" id="d_notes" value="${esc(existing?.notes||'')}">`, true)}
    </div>
    <div id="docUploadMsg" style="font-size:12px;color:var(--muted);margin-top:10px;min-height:16px;"></div>`;
  openModal(isEdit ? "تعديل سجل وثائق" : "إضافة سجل وثائق", body, async ()=>{
    const name = document.getElementById('d_name').value.trim();
    if(!name) return;
    const msg = document.getElementById('docUploadMsg');
    const saveBtn = document.getElementById('modalSave');
    const record = {
      employeeId: document.getElementById('d_employeeId').value,
      name,
      nameEn: document.getElementById('d_nameEn').value,
      jobTitle: document.getElementById('d_jobTitle').value,
      team: document.getElementById('d_team').value,
      nationality: document.getElementById('d_nationality').value,
      city: document.getElementById('d_city').value,
      birthDate: document.getElementById('d_birthDate').value,
      birthPlace: document.getElementById('d_birthPlace').value,
      iqamaNo: document.getElementById('d_iqamaNo').value,
      iqamaExpiry: document.getElementById('d_iqamaExpiry').value,
      passportNo: document.getElementById('d_passportNo').value,
      passportExpiry: document.getElementById('d_passportExpiry').value,
      workCardExpiry: document.getElementById('d_workCardExpiry').value,
      notes: document.getElementById('d_notes').value,
      iqamaFileUrl: existing?.iqamaFileUrl || null,
      passportFileUrl: existing?.passportFileUrl || null,
      workCardFileUrl: existing?.workCardFileUrl || null,
    };

    const uploads = [
      { input: document.getElementById('d_iqamaFile'), key: 'iqamaFileUrl', label: 'الإقامة' },
      { input: document.getElementById('d_passportFile'), key: 'passportFileUrl', label: 'الجواز' },
      { input: document.getElementById('d_workCardFile'), key: 'workCardFileUrl', label: 'بطاقة العمل' },
    ].filter(u => u.input && u.input.files && u.input.files[0]);

    if(uploads.length){
      saveBtn.disabled = true;
      for(const u of uploads){
        msg.textContent = `جارٍ رفع ملف ${u.label}...`;
        try{
          const fileName = `${name} — ${u.label}`;
          const uploaded = await driveUploadFile(u.input.files[0], fileName);
          record[u.key] = uploaded.url;
        } catch(e){
          msg.textContent = `تعذّر رفع ملف ${u.label} — تأكّد من اتصالك وحاول مرة أخرى`;
          saveBtn.disabled = false;
          return;
        }
      }
    }

    if(isEdit){
      const d = state.documents.find(x=>x.id===existing.id);
      if(d) Object.assign(d, record);
    } else {
      state.documents.push({ id: nextId('d'), ...record });
    }
    closeModal(); render(); saveDataToDrive();
  });
}

/* ---------------- modals / forms ---------------- */
function inputRow(label, inner, full){
  return `<div class="field ${full?'full':''}"><label>${label}</label>${inner}</div>`;
}
function statusOptions(map, selected){
  return Object.entries(map).map(([k,v])=>`<option value="${k}" ${k===selected?'selected':''}>${v.label}</option>`).join("");
}
function openModal(title, bodyHtml, onSave){
  const host = document.getElementById('modalHost');
  if(!host) return;
  host.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" id="modalBox">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <div class="disp" style="font-weight:700;font-size:16px;">${title}</div>
          <button id="modalClose" style="background:none;border:none;cursor:pointer;color:var(--muted);">${icon('x',18)}</button>
        </div>
        ${bodyHtml}
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px;">
          <button id="modalCancel" style="padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;">إلغاء</button>
          <button id="modalSave" style="padding:8px 16px;border-radius:9px;border:none;background:var(--navy);color:#fff;font-size:13px;font-weight:600;cursor:pointer;">حفظ</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); });
  document.getElementById('modalBox').addEventListener('click', (e)=>e.stopPropagation());
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', onSave);
}
function closeModal(){ const h=document.getElementById('modalHost'); if(h) h.innerHTML=""; }

function buildReportHTML(){
  const scopeLabel = state.activeTeam === 'all' ? 'كل الإدارات' : teamName(state.activeTeam);
  const tasks = state.tasks.filter(t => state.activeTeam==='all' || t.team===state.activeTeam);
  const corr = state.corr.filter(c => state.activeTeam==='all' || c.team===state.activeTeam);

  const taskStats = {
    total: tasks.length,
    done: tasks.filter(t=>t.status==='done').length,
    progress: tasks.filter(t=>t.status==='progress').length,
    paused: tasks.filter(t=>t.status==='paused').length,
    overdue: tasks.filter(isOverdue).length,
  };
  const corrStats = {
    total: corr.length,
    incoming: corr.filter(c=>c.dir==='وارد').length,
    outgoing: corr.filter(c=>c.dir==='صادر').length,
    linked: corr.filter(c=>c.linkedTaskId).length,
    unlinked: corr.filter(c=>!c.linkedTaskId).length,
  };

  const rptStat = (label, val, color) => `
    <div class="rpt-stat"><div style="font-size:10px;color:var(--muted);">${label}</div>
    <div class="rpt-disp" style="font-size:18px;font-weight:800;color:${color};">${val}</div></div>`;

  const badge = (map, key) => {
    const s = map[key]; if(!s) return '—';
    return `<span class="rpt-badge" style="background:${s.color}1A;color:${s.color};">${s.label}</span>`;
  };

  const taskRows = tasks.map(t=>`
    <tr>
      <td style="font-weight:700;color:var(--navy2);white-space:nowrap;">${t.key}</td>
      <td>${esc(t.task)}</td>
      <td style="white-space:nowrap;">${esc(teamName(t.team))}</td>
      <td style="white-space:nowrap;">R:${esc(t.R)} / A:${esc(t.A)}</td>
      <td>${badge(STATUS, t.status)}</td>
      <td style="white-space:nowrap;">${t.dueDate||'—'}${isOverdue(t)?' <span style="color:var(--red);font-weight:700;">(متأخرة)</span>':''}</td>
    </tr>`).join("") || `<tr><td colspan="6" style="text-align:center;color:var(--muted);">لا توجد مهام ضمن هذا النطاق</td></tr>`;

  const corrRows = corr.map(c=>`
    <tr>
      <td style="white-space:nowrap;">${esc(c.transactionNo||'—')}</td>
      <td style="font-weight:700;color:var(--navy2);white-space:nowrap;">${c.key}</td>
      <td>${esc(c.name)}</td>
      <td style="white-space:nowrap;">${esc(teamName(c.team))}</td>
      <td style="white-space:nowrap;">${c.dir}</td>
      <td style="white-space:nowrap;">${c.date}</td>
      <td>${badge(STATUS, c.status)}</td>
    </tr>`).join("") || `<tr><td colspan="7" style="text-align:center;color:var(--muted);">لا توجد معاملات ضمن هذا النطاق</td></tr>`;

  const now = new Date();
  const genDate = now.toLocaleDateString('ar-SA', { year:'numeric', month:'long', day:'numeric' });
  const genTime = now.toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' });

  return `
    <div class="rpt-wrap">
      <div class="rpt-header">
        <div class="rpt-disp" style="font-size:19px;font-weight:800;">معهد وتيرا — الإدارة التنفيذية</div>
        <div style="font-size:12.5px;color:#B9C2D0;margin-top:4px;">تقرير مهام RACI والتراسل</div>
        <div style="font-size:11px;color:#B9C2D0;margin-top:8px;">نطاق التقرير: ${esc(scopeLabel)} · تاريخ الإنشاء: ${genDate} — ${genTime}</div>
      </div>

      <div class="rpt-section-title">مؤشرات مهام RACI</div>
      <div class="rpt-stats">
        ${rptStat("إجمالي المهام", taskStats.total, "var(--navy2)")}
        ${rptStat("منجزة", taskStats.done, "var(--green)")}
        ${rptStat("تحت الإجراء", taskStats.progress, "var(--teal)")}
        ${rptStat("معلقة", taskStats.paused, "var(--muted)")}
        ${rptStat("متأخرة", taskStats.overdue, "var(--red)")}
      </div>
      <table>
        <thead><tr>${["المرجع","المهمة","الإدارة","الأدوار","الحالة","تاريخ التسليم"].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${taskRows}</tbody>
      </table>

      <div class="rpt-section-title">مؤشرات التراسل</div>
      <div class="rpt-stats">
        ${rptStat("إجمالي المعاملات", corrStats.total, "var(--navy2)")}
        ${rptStat("وارد", corrStats.incoming, "var(--blue)")}
        ${rptStat("صادر", corrStats.outgoing, "var(--teal)")}
        ${rptStat("مرتبطة بمهمة", corrStats.linked, "var(--green)")}
        ${rptStat("بدون ربط", corrStats.unlinked, "var(--amber)")}
      </div>
      <table>
        <thead><tr>${["رقم المعاملة","المرجع","اسم المعاملة","الإدارة","صادر/وارد","التاريخ","الحالة"].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${corrRows}</tbody>
      </table>

      <div class="rpt-footer">تم إنشاء هذا التقرير تلقائيًا من لوحة متابعة معهد وتيرا — ${genDate}</div>
    </div>`;
}

function printReport(){
  const host = document.getElementById('wt-print-report');
  if(!host) return;
  host.innerHTML = buildReportHTML();
  window.print();
}

function showBackupModal(text, stamp, autoDownloadWorked){
  const host = document.getElementById('modalHost');
  if(!host) return;
  host.innerHTML = `
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal" id="modalBox" style="max-width:640px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div class="disp" style="font-weight:700;font-size:16px;">نسخة احتياطية — wateera-backup-${stamp}.json</div>
          <button id="modalClose" style="background:none;border:none;cursor:pointer;color:var(--muted);">${icon('x',18)}</button>
        </div>
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">
          ${autoDownloadWorked
            ? 'إذا نزل الملف تلقائيًا لجهازك، خلاص انتهيت. وإذا ما نزل (شائع داخل بيئة المحادثة)، انسخ المحتوى بالأسفل والصقه بملف نصي جديد واحفظه بامتداد <b>.json</b>.'
            : 'التنزيل التلقائي ما اشتغل. انسخ المحتوى بالأسفل بالكامل، افتح محرر نصوص (Notepad مثلاً)، الصقه، واحفظ الملف بامتداد <b>.json</b>.'}
        </div>
        <textarea id="backupText" readonly style="width:100%;height:220px;font-family:monospace;font-size:11.5px;padding:10px;border-radius:8px;border:1px solid var(--line);resize:vertical;direction:ltr;text-align:left;">${esc(text)}</textarea>
        <div id="copyMsg" style="font-size:12px;color:var(--green);margin-top:6px;min-height:16px;"></div>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">
          <button id="modalCancel" style="padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;">إغلاق</button>
          <button id="copyBackupBtn" style="display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;border:none;background:var(--navy);color:#fff;font-size:13px;font-weight:600;cursor:pointer;">${icon('download',14)} نسخ الكل</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); });
  document.getElementById('modalBox').addEventListener('click', (e)=>e.stopPropagation());
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  const textarea = document.getElementById('backupText');
  document.getElementById('copyBackupBtn').addEventListener('click', ()=>{
    textarea.focus(); textarea.select();
    let copied = false;
    try{ copied = document.execCommand('copy'); }catch(e){ copied = false; }
    if(!copied && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>{
        document.getElementById('copyMsg').textContent = "تم النسخ ✓ — الصقه بملف نصي واحفظه بامتداد .json";
      });
    } else {
      document.getElementById('copyMsg').textContent = copied ? "تم النسخ ✓ — الصقه بملف نصي واحفظه بامتداد .json" : "تعذّر النسخ التلقائي — حدد النص يدويًا وانسخه (Ctrl+C)";
    }
  });
}

function openTaskForm(existing){
  const isEdit = !!existing;
  const labs = state.facilities.filter(f=>f.kind==='مختبر');
  const stations = state.facilities.filter(f=>f.kind==='محطة تجريبية');
  const selectedFacility = existing?.linkedFacilityId || "";
  const facilityOptionsHtml = () => `
    <option value="">بدون ربط</option>
    ${labs.length ? `<optgroup label="المختبرات">${labs.map(fa=>`<option value="${fa.id}" ${fa.id===selectedFacility?'selected':''}>${fa.key} — ${esc(fa.name)}</option>`).join("")}</optgroup>` : ''}
    ${stations.length ? `<optgroup label="المحطات التجريبية">${stations.map(fa=>`<option value="${fa.id}" ${fa.id===selectedFacility?'selected':''}>${fa.key} — ${esc(fa.name)}</option>`).join("")}</optgroup>` : ''}
  `;
  const initialTeam = existing?.team || state.teams[0].id;
  const body = `
    <div class="fgrid">
      ${inputRow("رقم المرجع (اختياري)", `<input type="text" id="f_key" placeholder="يُولَّد تلقائيًا" value="${esc(existing?.key||'')}" ${isEdit?'disabled':''}>`)}
      ${inputRow("الفريق", `<select id="f_team">${teamOptions(initialTeam)}</select>`)}
      ${inputRow("مختبر / محطة مرتبطة (اختياري)", `<select id="f_facility">${facilityOptionsHtml()}</select>`, true)}
      ${inputRow("وصف المهمة", `<input type="text" id="f_task" value="${esc(existing?.task||'')}">`, true)}
      ${inputRow("نوع المهمة", `<input type="text" id="f_type" value="${esc(existing?.type||'بحثية')}">`)}
      ${inputRow("الحالة", `<select id="f_status">${statusOptions(STATUS, existing?.status || 'progress')}</select>`)}
      ${inputRow("المنفذ (R)", `<input type="text" id="f_R" value="${esc(existing?.R||'')}">`)}
      ${inputRow("المسؤول (A)", `<input type="text" id="f_A" value="${esc(existing?.A||'')}">`)}
      ${inputRow("المستشار (C)", `<input type="text" id="f_C" value="${esc(existing?.C||'')}">`)}
      ${inputRow("الإشعار (I)", `<input type="text" id="f_I" value="${esc(existing?.I||'')}">`)}
      ${inputRow("تاريخ التسليم", `<input type="date" id="f_due" value="${existing?.dueDate || todayISO()}">`)}
      ${isEdit ? inputRow("ملاحظات", `<input type="text" id="f_notes" value="${esc(existing?.notes||'')}">`, true) : ''}
    </div>`;
  openModal(isEdit ? "تعديل مهمة RACI" : "إضافة مهمة RACI", body, ()=>{
    const task = document.getElementById('f_task').value.trim();
    if(!task) return;
    const team = document.getElementById('f_team').value;
    const facilityId = document.getElementById('f_facility').value || null;

    if(isEdit){
      const t = state.tasks.find(x=>x.id===existing.id);
      if(t){
        t.team = team; t.task = task;
        t.type = document.getElementById('f_type').value;
        t.R = document.getElementById('f_R').value;
        t.A = document.getElementById('f_A').value;
        t.C = document.getElementById('f_C').value;
        t.I = document.getElementById('f_I').value;
        t.status = document.getElementById('f_status').value;
        t.dueDate = document.getElementById('f_due').value;
        t.notes = document.getElementById('f_notes').value;
        t.linkedFacilityId = facilityId;
      }
      closeModal(); render(); saveDataToDrive();
      return;
    }

    const id = nextId('r');
    const key = document.getElementById('f_key').value.trim() || `K-${idCounter}`;
    state.tasks.push({
      id, key, team, task,
      type: document.getElementById('f_type').value, R: document.getElementById('f_R').value,
      A: document.getElementById('f_A').value, C: document.getElementById('f_C').value, I: document.getElementById('f_I').value,
      status: document.getElementById('f_status').value, dueDate: document.getElementById('f_due').value, notes:"",
      linkedCorrId:null, linkedFacilityId: facilityId,
    });
    closeModal(); render(); saveDataToDrive();
  });
}

function openCorrForm(existing){
  const isEdit = !!existing;
  const body = `
    <div class="fgrid">
      ${inputRow("رقم المعاملة", `<input type="text" id="c_txn" placeholder="مثال: 2026/1450" value="${esc(existing?.transactionNo||'')}">`)}
      ${inputRow("رقم المرجع (اختياري)", `<input type="text" id="c_key" placeholder="يُولَّد تلقائيًا" value="${esc(existing?.key||'')}" ${isEdit?'disabled':''}>`)}
      ${inputRow("الفريق", `<select id="c_team">${teamOptions(existing?.team || state.teams[0].id)}</select>`)}
      ${inputRow("اسم المعاملة", `<input type="text" id="c_name" value="${esc(existing?.name||'')}">`, true)}
      ${inputRow("داخلي / خارجي", `<select id="c_scope"><option ${existing?.scope==='داخلي'?'selected':''}>داخلي</option><option ${existing?.scope==='خارجي'?'selected':''}>خارجي</option></select>`)}
      ${inputRow("صادر / وارد", `<select id="c_dir"><option ${existing?.dir==='وارد'?'selected':''}>وارد</option><option ${existing?.dir==='صادر'?'selected':''}>صادر</option></select>`)}
      ${inputRow("المحالة إليه", `<input type="text" id="c_ref" value="${esc(existing?.referredTo||'')}">`)}

    </div>
    ${isEdit ? '' : `<label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;cursor:pointer;">
      <input type="checkbox" id="c_createTask" checked> إنشاء مهمة RACI مرتبطة تلقائيًا لمتابعة هذه المعاملة

    const name = document.getElementById('c_name').value.trim();

    const transactionNo = document.getElementById('c_txn').value.trim();

    if(isEdit){
      const c = state.corr.find(x=>x.id===existing.id);
      if(c){
        c.transactionNo = transactionNo; c.team = team; c.name = name;
        c.scope = document.getElementById('c_scope').value;
        c.dir = document.getElementById('c_dir').value;
        c.referredTo = referredTo;
        c.date = document.getElementById('c_date').value;
        c.status = document.getElementById('c_status').value;
      }
      closeModal(); render(); saveDataToDrive();
      return;
    }

    const cid = nextId('c');
    const key = document.getElementById('c_key').value.trim() || `K-${idCounter}`;
    const createTask = document.getElementById('c_createTask').checked;
    state.corr.push({

      linkedTaskId: createTask ? "PENDING" : null,

        status:"progress", dueDate:"", notes:`منشأة تلقائيًا من معاملة ${key}`, linkedCorrId: cid, linkedFacilityId:null,
      });
      const c = state.corr.find(x=>x.id===cid); c.linkedTaskId = tid;

function openFacilityForm(presetKind, existing){
  const isEdit = !!existing;
  const kind = existing ? existing.kind : (presetKind || "مختبر");
  const body = `
    <div class="fgrid">
      ${inputRow("رقم المرجع (اختياري)", `<input type="text" id="fac_key" placeholder="يُولَّد تلقائيًا" value="${esc(existing?.key||'')}" ${isEdit?'disabled':''}>`)}
      ${inputRow("النوع", `<select id="fac_kind"><option ${kind==='مختبر'?'selected':''}>مختبر</option><option ${kind==='محطة تجريبية'?'selected':''}>محطة تجريبية</option></select>`)}
      ${inputRow("الاسم", `<input type="text" id="fac_name" value="${esc(existing?.name||'')}">`, true)}
      ${inputRow("الفريق المسؤول", `<select id="fac_team">${teamOptions(existing?.team || state.teams[0].id)}</select>`)}
      ${inputRow("الحالة", `<select id="fac_status">${statusOptions(LAB_STATUS, existing?.status || 'active')}</select>`)}
      ${inputRow("الموقع", `<input type="text" id="fac_loc" value="${esc(existing?.location||'')}">`)}
      ${inputRow("السعة / الطاقة الاستيعابية", `<input type="text" id="fac_cap" value="${esc(existing?.capacity||'')}">`)}
      ${inputRow("ملاحظات", `<input type="text" id="fac_notes" value="${esc(existing?.notes||'')}">`, true)}
    </div>
    ${isEdit ? '' : `<label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;cursor:pointer;">
      <input type="checkbox" id="fac_createTask"> إنشاء مهمة RACI مرتبطة تلقائيًا (صيانة / متابعة تشغيل)
    </label>`}`;
  openModal(isEdit ? "تعديل " + (kind === "مختبر" ? "مختبر" : "محطة تجريبية") : (kind === "مختبر" ? "إضافة مختبر" : "إضافة محطة تجريبية"), body, ()=>{
    const name = document.getElementById('fac_name').value.trim();
    if(!name) return;
    const status = document.getElementById('fac_status').value;
    const team = document.getElementById('fac_team').value;

    if(isEdit){
      const f = state.facilities.find(x=>x.id===existing.id);
      if(f){
        f.kind = document.getElementById('fac_kind').value;
        f.name = name; f.team = team; f.status = status;
        f.location = document.getElementById('fac_loc').value;
        f.capacity = document.getElementById('fac_cap').value;
        f.notes = document.getElementById('fac_notes').value;
      }
      closeModal(); render(); saveDataToDrive();
      return;
    }

    const fid = nextId('f');
    const key = document.getElementById('fac_key').value.trim() || `F-${idCounter}`;
    const createTask = document.getElementById('fac_createTask').checked;
    state.facilities.push({
      id: fid, key, kind: document.getElementById('fac_kind').value, name, team, status,
      location: document.getElementById('fac_loc').value, capacity: document.getElementById('fac_cap').value,
      notes: document.getElementById('fac_notes').value,
    });
    if(createTask){
      state.tasks.push({
        id: nextId('r'), key, team, task: status==='maintenance' ? `صيانة: ${name}` : `متابعة تشغيل: ${name}`,
        type:"صيانة", R:"—", A:"—", C:"—", I:"—", status: status==='maintenance' ? "progress" : "paused",
        dueDate:"", notes:`منشأة تلقائيًا من مرفق ${key}`, linkedCorrId:null, linkedFacilityId: fid,
      });
    }
    closeModal(); render(); saveDataToDrive();
  });
}

/* ---------------- events ---------------- */
function bindEvents(){
  root.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.tab = btn.getAttribute('data-tab'); state.search=""; render(); });
  });
  root.querySelectorAll('[data-team]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.activeTeam = btn.getAttribute('data-team'); render(); });
  });
  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{ state.search = e.target.value; render(); searchInput.focus(); });
  }
  const addTaskBtn = document.getElementById('addTaskBtn'); if(addTaskBtn) addTaskBtn.addEventListener('click', ()=>openTaskForm());
  const addCorrBtn = document.getElementById('addCorrBtn'); if(addCorrBtn) addCorrBtn.addEventListener('click', ()=>openCorrForm());
  const addLabBtn = document.getElementById('addFacilityBtn_labs'); if(addLabBtn) addLabBtn.addEventListener('click', ()=>openFacilityForm("مختبر"));
  const addStationBtn = document.getElementById('addFacilityBtn_stations'); if(addStationBtn) addStationBtn.addEventListener('click', ()=>openFacilityForm("محطة تجريبية"));
  root.querySelectorAll('.editTaskBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = state.tasks.find(x=>x.id===btn.getAttribute('data-id'));
      if(t) openTaskForm(t);
    });
  });
  root.querySelectorAll('.editCorrBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const c = state.corr.find(x=>x.id===btn.getAttribute('data-id'));
      if(c) openCorrForm(c);
    });
  });
  root.querySelectorAll('.editFacilityBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const f = state.facilities.find(x=>x.id===btn.getAttribute('data-id'));
      if(f) openFacilityForm(f.kind, f);
    });
  });
  const addDocumentBtn = document.getElementById('addDocumentBtn');
  if(addDocumentBtn) addDocumentBtn.addEventListener('click', ()=>openDocumentForm());
  root.querySelectorAll('.editDocumentBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const d = state.documents.find(x=>x.id===btn.getAttribute('data-id'));
      if(d) openDocumentForm(d);
    });
  });

  const reportBtn = document.getElementById('reportBtn');
  if(reportBtn) reportBtn.addEventListener('click', printReport);
  const signOutBtn = document.getElementById('signOutBtn');
  if(signOutBtn) signOutBtn.addEventListener('click', signOut);

  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    const payload = { teams: state.teams, tasks: state.tasks, corr: state.corr, facilities: state.facilities, documents: state.documents, idCounter, exportedAt: new Date().toISOString() };
    const text = JSON.stringify(payload, null, 2);
    const stamp = new Date().toISOString().slice(0,10);

    let autoDownloadWorked = false;
    try{
      const blob = new Blob([text], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `wateera-backup-${stamp}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      autoDownloadWorked = true;
    } catch(e){ autoDownloadWorked = false; }

    showBackupModal(text, stamp, autoDownloadWorked);
  });

  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');
  if(importBtn && importFile){
    importBtn.addEventListener('click', ()=> importFile.click());
    importFile.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          const data = JSON.parse(ev.target.result);
          if(!data.teams || !data.tasks || !data.corr || !data.facilities) throw new Error("ملف غير صالح");
          state.teams = data.teams; state.tasks = data.tasks; state.corr = data.corr; state.facilities = data.facilities;
          state.documents = data.documents || [];
          idCounter = data.idCounter || idCounter;
          render(); saveDataToDrive();
        } catch(err){
          alert("تعذّرت قراءة ملف النسخة الاحتياطية — تأكد أنه ملف JSON صادر من هذه اللوحة.");
        }
        importFile.value = "";
      };
      reader.readAsText(file);
    });
  }
}

render();
waitForGIS(()=>{
  initGoogleAuth();
  state.gisReady = true;
  render();
});
})();
</script>
